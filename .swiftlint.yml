# SwiftLint-Konfiguration für Famlist.
# Wird vom täglichen Code-Review genutzt (.claude/code-review/run_checks.sh)
# und kann lokal mit `swiftlint` im Repo-Root ausgeführt werden.

included:
  - Famlist
  - FamlistWatch
  - FamlistWatchWidgets
  - FamlistWatchTests
  - FamlistUITests

excluded:
  - design-handoff
  - scripts
  - build
  - DerivedData

opt_in_rules:
  # Effizienz
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - reduce_into
  - flatmap_over_map_reduce
  # Robustheit
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture
  - weak_delegate
  # Hygiene
  - closure_body_length
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - trailing_whitespace
  - trailing_comma
  - opening_brace
  # snake_case-Felder spiegeln Supabase-Spalten, kurze Lokalnamen sind gewollt
  - identifier_name
  # SwiftUI-Idiom (Button { } label: { })
  - multiple_closures_with_trailing_closure
  - implicit_optional_initialization

line_length:
  warning: 160
  error: 240
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

closure_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 12
  error: 20

function_parameter_count:
  warning: 6
  error: 9

nesting:
  type_level: 2
