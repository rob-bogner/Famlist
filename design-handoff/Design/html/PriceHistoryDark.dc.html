<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Preisverlauf – Dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #071012">
<dc-import name="PriceHistory" theme="dark" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1FC2CC","options":["#1FC2CC","#4C8DFF","#8B6CFF","#FF8A4C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1FC2CC' };
  }
}
</script>
</body>
</html>
