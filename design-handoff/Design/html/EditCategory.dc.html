<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kategorie bearbeiten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
input::placeholder{color:inherit;opacity:0.75}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="ManageCategories" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>
<section aria-label="Kategorie bearbeiten" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 594px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden; padding: 10px 20px 34px 20px; display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Kategorie bearbeiten</h1>
<button aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{k.close}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<div style="margin-top: 20px; display: flex; align-items: center; gap: 14px"><span style="width: 64px; height: 64px; border-radius: 20px; background: {{avatarBg}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s-6 6.6-6 10.5a6 6 0 0 0 12 0c0-3.9-6-10.5-6-10.5z"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px"><span style="padding-left: 4px; font-size: 13px; font-weight: 600; color: {{k.sub}}">Name</span>
<input type="text" aria-label="Name der Kategorie" value="Milchprodukte" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid {{k.ring}}; box-shadow: 0 0 0 4px {{k.ringSoft}}; background: {{k.fieldFocus}}; font-size: 16px; font-weight: 500; color: {{k.text}}; outline: none">
</div></div>
<div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="padding-left: 4px; font-size: 13px; font-weight: 600; color: {{k.sub}}">Icon</span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px"><button aria-label="Icon 1" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19l8-8"></path></svg></button><button aria-label="Icon 2" style="height: 56px; border-radius: 16px; border: 2px solid {{k.ring}}; background: {{k.ringSoft}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s-6 6.6-6 10.5a6 6 0 0 0 12 0c0-3.9-6-10.5-6-10.5z"></path></svg></button><button aria-label="Icon 3" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1.5-3 4-3 7h3"></path></svg></button><button aria-label="Icon 4" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM8 7.2v1.6"></path></svg></button><button aria-label="Icon 5" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.5 10.5a2 2 0 0 1-2 1.5h-9a2 2 0 0 1-2-1.5zM8 9V6a4 4 0 0 1 8 0v3"></path></svg></button><button aria-label="Icon 6" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 3 5 6 5 9a5 5 0 0 1-10 0c0-3 2-6 5-9z"></path></svg></button><button aria-label="Icon 7" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h14v4a7 7 0 0 1-14 0zM9 6c0-1 1-2 1-3M13 6c0-1 1-2 1-3"></path></svg></button><button aria-label="Icon 8" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20c-2-4-2-9 1-12 2-2 6-2 8 0 3 3 3 8 1 12zM12 8V4"></path></svg></button><button aria-label="Icon 9" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0zM12 12v8M9 20h6"></path></svg></button><button aria-label="Icon 10" style="height: 56px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1 18H7zM6 8h12"></path></svg></button></div></div>
<div style="margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><button style="position: relative; width: 100%; height: 56px; flex-shrink: 0; border-radius: 28px; border: 0; padding: 0; background: {{cta.bg}}; box-shadow: {{cta.shadow}}; color: {{cta.text}}; font-size: 16px; font-weight: 600; cursor: pointer; overflow: hidden">
<span style="position: absolute; left: 24px; right: 24px; top: 2px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); pointer-events: none"></span>
<span style="position: relative">Speichern</span>
</button>
<button style="height: 48px; border: 0; border-radius: 24px; background: transparent; color: {{k.danger}}; font-size: 15px; font-weight: 600; cursor: pointer">Kategorie löschen</button>
<span style="margin-top: -4px; font-size: 12px; color: {{k.sub}}; text-align: center">Artikel dieser Kategorie wandern nach „Sonstiges“.</span></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      card: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03))', cardBorder: 'rgba(255,255,255,0.08)', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px -14px rgba(0,0,0,0.7)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)', fieldFocus: 'rgba(255,255,255,0.06)', ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.12),
      line: 'rgba(255,255,255,0.08)', accentText: light, danger: '#FF7A7E', dangerSoft: 'rgba(255,122,126,0.12)',
      toggleOn: 'linear-gradient(180deg, ' + light + ', ' + accent + ')', toggleOff: 'rgba(255,255,255,0.14)',
      segBg: 'rgba(255,255,255,0.06)', segOn: 'rgba(255,255,255,0.14)', segOnText: '#FFFFFF',
      menu: 'rgba(20,34,37,0.97)', menuBorder: 'rgba(255,255,255,0.1)', menuShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 24px 48px -16px rgba(0,0,0,0.8)',
      tile: 'linear-gradient(150deg, ' + rgba(accent, 0.24) + ', ' + rgba(accent, 0.06) + ')', dashed: rgba(accent, 0.45)
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      card: '#FFFFFF', cardBorder: '#EDF2F2', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 10px 22px -14px rgba(12,40,44,0.22)',
      field: '#F4F7F7', fieldBorder: '#E6EDEE', fieldFocus: '#FFFFFF', ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12),
      line: '#EDF1F2', accentText: deep, danger: '#C8363B', dangerSoft: 'rgba(200,54,59,0.08)',
      toggleOn: 'linear-gradient(180deg, ' + accent + ', ' + deep + ')', toggleOff: '#DCE5E6',
      segBg: '#F1F5F5', segOn: '#FFFFFF', segOnText: '#0F2528',
      menu: 'rgba(255,255,255,0.97)', menuBorder: 'rgba(15,37,40,0.08)', menuShadow: '0 24px 48px -16px rgba(12,40,44,0.35)',
      tile: 'linear-gradient(150deg, #F4F8F8, #E2ECED)', dashed: rgba(accent, 0.45)
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    return { k, cta, theme, accent, avatarBg: 'linear-gradient(150deg, ' + light + ', ' + deep + ')' };
  }
}
</script>
</body>
</html>
