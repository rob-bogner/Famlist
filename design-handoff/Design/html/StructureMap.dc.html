<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App-Struktur Famlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F6F9F9}
</style>
</helmet>
<div style="width: 1760px; height: 1700px; box-sizing: border-box; padding: 56px 64px; background: #F6F9F9; color: #0F2528; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">

<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6C75">Stand 14.10.2026 · entspricht dem App-Code</span>
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.02em">App-Struktur Famlist</h1>
</div>
<div style="display: flex; gap: 12px">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: {{l.bg}}; border: 1.5px {{l.line}} {{l.border}}; color: {{l.text}}; font-size: 14px; font-weight: 600">{{l.label}} · {{l.count}}</span>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 14px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3ECED">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 6px 4px; border-bottom: 1px solid #EDF2F2">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5F7579">{{g.letter}}</span>
<span style="font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600">{{g.title}}</span>
</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 14px; background: {{it.bg}}; border: 1.5px {{it.line}} {{it.border}}">
<span style="font-size: 14px; font-weight: 600; color: #0F2528; line-height: 1.3">{{it.name}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{it.text}}">{{it.label}}</span>
<sc-if value="{{it.hasNote}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #4E6468; line-height: 1.35">{{it.note}}</span>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600">Kern-Workflows</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px">
<sc-for list="{{flows}}" as="f" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3ECED">
<span style="width: 30px; height: 30px; border-radius: 10px; background: #0B6C75; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{f.n}}</span>
<span style="width: 150px; font-size: 14px; font-weight: 700; flex-shrink: 0">{{f.title}}</span>
<span style="font-size: 14px; color: #33494D; line-height: 1.4">{{f.steps}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      done: { label: 'Fertig', bg: '#E8F6F7', border: '#0FA3AE', text: '#0B6C75', line: 'solid' },
      adjust: { label: 'Anpassen', bg: '#FFF6E6', border: '#D99A2B', text: '#8A5A00', line: 'solid' },
      neu: { label: 'Neu seit Planung', bg: '#F1F2FF', border: '#6570E8', text: '#3A43B5', line: 'dashed' }
    };
    const it = (name, s, note) => Object.assign({ name, note: note || '', hasNote: !!note }, S[s]);
    // Stand 14.10.2026 = heutiger App-Code (alle Screens gebaut). „Fertig“ = im Code, „Neu“ = seit dem letzten Abgleich dazugekommen.
    const groups = [
      { letter: 'A', title: 'Einstieg', items: [
        it('Anmelden', 'done', 'E-Mail-Link oder „Mit Apple anmelden“; Hinweis „Anmeldelink gesendet“'),
        it('Profil anlegen', 'done', 'Foto, Benutzername (frei/vergeben), voller Name'),
        it('Einladung annehmen', 'done', 'Aus dem Einladungslink; Annehmen öffnet die Liste'),
        it('Konto wiederherstellen', 'neu', 'Nach erneutem Anmelden innerhalb von 60 Tagen; auch offline-Hinweis und „Endgültig löschen“'),
        it('Leere Liste', 'done', 'Erster Artikel, erste Liste')
      ] },
      { letter: 'B', title: 'Liste', items: [
        it('Liste · Alle / Offen / Erledigt', 'done', 'Live-Gesamtkosten, Profilbild „Hinzugefügt von“, Menge direkt ändern'),
        it('Abhaken · Rückgängig', 'done', 'Wischen und/oder Kreis (Einstellung), Rückgängig-Toast'),
        it('Wisch-Aktionen', 'done'),
        it('Dock', 'done', 'Alle abhaken / Zurücksetzen, Sortieren, Kopieren, Löschen; „Einkauf erledigt“ als Popup'),
        it('Kontext-Menü (☰)', 'done', 'Mitglieder & Teilen, Artikel/Kategorien verwalten, Kassenzettel scannen, Gespeicherte Kassenzettel, Import, Artikelbilder, Einstellungen'),
        it('Artikel löschen · Auswahl', 'done', 'Nur abgehakte oder alle, mit Rückgängig')
      ] },
      { letter: 'C', title: 'Artikel', items: [
        it('Hinzufügen · Eingabe / Treffer', 'done', 'Plus im Dock'),
        it('Neuer Artikel', 'done', 'Marke unter dem Namen'),
        it('Produktdetails / bearbeiten', 'done', 'Link zum Preisverlauf'),
        it('Barcode-Scanner', 'done', 'Plus halten → „Barcode“; Menge halten'),
        it('Foto erkennen', 'neu', 'Plus halten → „Foto erkennen“; Kamera · Mediathek'),
        it('Artikel verwalten', 'done', 'Alle gespeicherten Artikel: bearbeiten, Foto ändern, löschen'),
        it('Preisverlauf', 'done', 'Preise pro Artikel und Laden über die Zeit'),
        it('Import aus Zwischenablage', 'neu')
      ] },
      { letter: 'D', title: 'Listen & Teilen', items: [
        it('Meine Listen', 'done', 'Wechseln, erstellen; Wischen: Favorit · Löschen/Verlassen, Umbenennen, Duplizieren, Mitglieder; Rückgängig'),
        it('Listen-Optionen', 'done', 'Langer Druck: Umbenennen, Duplizieren, Favorit, Mitglieder & Teilen, Löschen/Verlassen'),
        it('Liste erstellen · umbenennen', 'done', 'Neue Liste mit „Als Favorit“'),
        it('Liste löschen', 'done', 'Schieben zum Löschen; letzte Liste nicht löschbar'),
        it('Mitglieder & Teilen', 'done', 'Einladungslink teilen/kopieren, öffentliche ID; archivierte Mitglieder entfernen')
      ] },
      { letter: 'E', title: 'Kassenzettel', items: [
        it('Kassenzettel fotografieren', 'done'),
        it('Erkennung prüfen', 'done', 'Erkannte Artikel und Preise bestätigen und der Liste zuordnen'),
        it('Einkauf erledigt', 'done', 'Summe, gespeicherte Preise'),
        it('Gespeicherte Kassenzettel', 'neu', 'Archiv, Bon-Details, Auswertungen (Ausgaben, Verbrauch)')
      ] },
      { letter: 'F', title: 'Kategorien', items: [
        it('Kategorien verwalten', 'done', '27 Standard-Kategorien; anlegen, umbenennen, Reihenfolge = Ladenweg'),
        it('Kategorie bearbeiten', 'done', 'Name, Icon und Farbe')
      ] },
      { letter: 'G', title: 'Konto', items: [
        it('Einstellungen', 'done', 'Erscheinungsbild, Preise, Artikelbilder, Artikel abhaken, Kassenzettel, Benachrichtigungen, Abmelden'),
        it('Profil bearbeiten', 'done', 'Nur über Einstellungen erreichbar'),
        it('Abmelden', 'done', 'Bei ungesendeten Änderungen: „Trotzdem abmelden?“'),
        it('Konto löschen', 'done', 'Schieben zum Löschen; 60 Tage wiederherstellbar')
      ] }
    ];
    const all = groups.reduce((a, g) => a.concat(g.items), []);
    const count = (k) => all.filter((x) => x.label === S[k].label).length;
    const legend = ['done', 'adjust', 'neu'].map((k) => Object.assign({ count: count(k) }, S[k]));
    const flows = [
      { n: '1', title: 'Artikel hinzufügen', steps: 'Plus im Dock → Eingabe → Treffer übernehmen oder „Neuer Artikel“' },
      { n: '2', title: 'Barcode · Foto', steps: 'Plus gedrückt halten → „Barcode | Foto erkennen“ → Scanner bzw. Foto → Treffer oder Neuer Artikel (vorausgefüllt)' },
      { n: '3', title: 'Einkaufen', steps: 'Liste → abhaken (Wischen/Kreis) → Rückgängig-Toast → alles abgehakt → „Einkauf erledigt“' },
      { n: '4', title: 'Kassenzettel', steps: '☰ → Kassenzettel scannen → Erkennung prüfen → Preise gespeichert → Gespeicherte Kassenzettel · Preisverlauf' },
      { n: '5', title: 'Teilen', steps: '☰ (oder Meine Listen → Wischen / langer Druck) → Mitglieder & Teilen → Einladungslink teilen oder kopieren' },
      { n: '6', title: 'Einladung', steps: 'Link öffnen → Anmelden → Profil anlegen → Einladung annehmen → geteilte Liste' },
      { n: '7', title: 'Listen', steps: 'Titel „Edeka ⌄“ → Meine Listen → wechseln · erstellen · wischen  ·  langer Druck → Listen-Optionen' },
      { n: '8', title: 'Konto', steps: '☰ → Einstellungen → Profil · Abmelden · Konto löschen (Schieben) → neu anmelden → Konto wiederherstellen' }
    ];
    return { groups, legend, flows };
  }
}
</script>
</body>
</html>
