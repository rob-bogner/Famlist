<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Liste filtern</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<!-- Filter aktiv: Fortschritt, Tabs und Dock blenden aus; die Liste zeigt nur Treffer (live beim Tippen) -->
<div style="position: absolute; left: 0; right: 0; top: 116px; bottom: 0; background: {{f.bg}}"></div>

<!-- Filterfeld (aktiv), gleiche Position wie in der Liste: top 124, 52 hoch -->
<label style="position: absolute; left: 20px; right: 20px; top: 124px; height: 52px; box-sizing: border-box; padding: 0 6px 0 18px; border-radius: 26px; background: {{k.fieldSolid}}; border: 1.5px solid {{k.ring}}; box-shadow: 0 0 0 4px {{k.ringSoft}}, 0 8px 20px -12px {{k.ringGlow}}; display: flex; align-items: center; gap: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<input type="text" aria-label="In dieser Liste filtern" value="milch" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; font-weight: 500; color: {{k.text}}">
<button aria-label="Filter aufheben" style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gn.bg}}; box-shadow: {{gn.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gn.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gn.glow}}; filter: blur(2px); pointer-events: none"></span><svg style="position: relative; filter: {{gn.iconShadow}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gn.icon}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</label>

<!-- Trefferzeile -->
<div style="position: absolute; left: 24px; right: 24px; top: 190px; height: 22px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}">2 von 9 Artikeln · auch abgehakte</span>
</div>

<!-- Treffer als normale Artikel-Karten (abhaken, wischen, bearbeiten wie gewohnt) -->
<div style="position: absolute; left: 20px; right: 20px; top: 224px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{hits}}" as="h" hint-placeholder-count="2">
<div style="height: 94px; box-sizing: border-box; padding: 14px; border-radius: 24px; background: {{k.card}}; border: 1px solid {{k.cardBorder}}; box-shadow: {{f.cardShadow}}; display: flex; align-items: center; gap: 16px">
<div style="width: 64px; height: 64px; border-radius: 18px; background: {{k.thumb}}; box-shadow: {{k.thumbShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: {{h.op}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{k.thumbIcon}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M9.5 5h5l1.5 2H19a2 2 0 0 1 2 2v8.5M17 19H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2"></path><path d="M9.9 10.2a3 3 0 0 0 4 4"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; align-items: flex-start; min-width: 0; opacity: {{h.op}}">
<span style="font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600; color: {{k.text}}; text-decoration: {{h.strike}}; white-space: nowrap">{{h.pre}}<span style="color: {{k.accentText}}; background: {{k.hl}}; border-radius: 5px; padding: 0 1px">{{h.hit}}</span>{{h.post}}</span>
<span style="padding: 4px 11px; border-radius: 999px; background: {{f.chipBg}}; color: {{k.accentText}}; font-size: 13px; font-weight: 600; box-shadow: {{f.chipInset}}">{{h.qty}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0">
<sc-if value="{{h.done}}" hint-placeholder-val="{{ false }}"><span style="width: 32px; height: 32px; border-radius: 50%; background: {{f.checkOn}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
<sc-if value="{{h.open}}" hint-placeholder-val="{{ true }}"><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{f.checkRing}}; background: {{f.checkBg}}; box-shadow: {{f.checkShadow}}"></span></sc-if>
<span style="font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; line-height: 19px; white-space: nowrap; color: {{k.text}}; opacity: {{h.op}}">{{h.price}}</span>
</div>
</div>
</sc-for>
</div>

<!-- Brücke zum Hinzufügen: nicht auf der Liste? → öffnet die Eingabe unten mit dem Suchbegriff -->
<button style="position: absolute; left: 20px; right: 20px; top: 448px; height: 60px; box-sizing: border-box; padding: 0 10px 0 16px; border-radius: 18px; border: 1.5px dashed {{f.dashed}}; background: transparent; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{k.accentText}}; font-size: 15px; font-weight: 600; text-align: left">
<span style="flex-grow: 1">„milch“ zur Liste hinzufügen</span>

</button>

      chipBg: rgba(accent, 0.16), chipInset: 'inset 0 0 0 1px ' + rgba(accent, 0.3), checkRing: rgba(accent, 0.55), checkBg: 'rgba(0,0,0,0.25)', checkShadow: 'inset 0 2px 4px rgba(0,0,0,0.5)', dashed: rgba(accent, 0.45)
    } : {
      bg: '#FFFFFF', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 14px 32px -14px rgba(12,40,44,0.22)',
      chipBg: rgba(accent, 0.1), chipInset: 'inset 0 0 0 1px ' + rgba(accent, 0.16), checkRing: '#CFDCDE', checkBg: '#FFFFFF', checkShadow: 'inset 0 2px 3px rgba(12,40,44,0.08)', dashed: rgba(accent, 0.4)
    };
    f.checkOn = 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)';
    const hits = [
      { pre: '', hit: 'Milch', post: '', qty: '2 Liter', price: '2,38 €', done: false, op: 1, strike: 'none' },
      { pre: 'Butter', hit: 'milch', post: '', qty: '1 Becher', price: '0,79 €', done: true, op: 0.55, strike: 'line-through' }
    ].map((h) => Object.assign({ open: !h.done }, h));
    return { k, gp, gn, f, cta, theme, accent, hits };
  }
}
