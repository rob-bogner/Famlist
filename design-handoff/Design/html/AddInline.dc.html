<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Artikel hinzufügen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<!-- Plus antippen: ganze Liste abgedunkelt, Dock weicht der Eingabe über der Tastatur -->
<div style="position: absolute; inset: 0; background: {{k.scrimList}}; backdrop-filter: blur(2px)"></div>

<!-- Treffer wachsen von unten nach oben; bester Treffer direkt über dem Feld (Daumen) -->

<button style="height: 56px; box-sizing: border-box; padding: 0 8px; border: 0; border-radius: 16px; background: transparent; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{k.accentText}}; font-size: 15px; font-weight: 600; text-align: left">
<span style="flex-grow: 1">„{{q}}“ als neuen Artikel anlegen</span>
<span style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gp.bg}}; box-shadow: {{gp.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gp.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gp.glow}}; filter: blur(2px); pointer-events: none"></span><svg style="position: relative; filter: {{gp.iconShadow}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gp.icon}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></span>
</button>
<div style="margin: 4px 4px 4px 4px; height: 1px; background: {{k.line}}"></div>
<sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
<span style="padding: 6px 10px 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}">Weitere Produkte</span>
<sc-for list="{{more}}" as="it" hint-placeholder-count="2">
<div role="option" style="height: 56px; box-sizing: border-box; padding: 0 6px 0 8px; border-radius: 16px; display: flex; align-items: center; gap: 12px">
<sc-if value="{{images}}" hint-placeholder-val="{{ true }}"><div style="width: 40px; height: 40px; border-radius: 13px; background: {{k.thumb}}; box-shadow: {{k.thumbShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{it.img}}" hint-placeholder-val="{{ false }}"><img src="{{it.img}}" alt="" width="40" height="40" style="display: block; width: 40px; height: 40px"></sc-if><sc-if value="{{it.noImg}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.thumbIcon}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2 11h10.5l2-8H7"></path><circle cx="9.5" cy="19" r="1.2"></circle><circle cx="16.5" cy="19" r="1.2"></circle></svg></sc-if>
</div></sc-if>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 500; color: {{k.text}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.pre}}<b style="font-weight: 700; color: {{k.accentText}}">{{it.hit}}</b>{{it.post}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{k.sub}}; white-space: nowrap">{{it.meta}}<sc-if value="{{it.inList}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 7px; border-radius: 999px; background: {{k.hl}}; color: {{k.accentText}}; font-weight: 600">{{it.badge}}</span></sc-if></span>
</div>
<button aria-label="{{it.addLabel}}" style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gp.bg}}; box-shadow: {{gp.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gp.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gp.glow}}; filter: blur(2px); pointer-events: none"></span><svg style="position: relative; filter: {{gp.iconShadow}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gp.icon}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</sc-for>
<span style="padding: 8px 10px 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}">Deine Artikel</span>
<sc-for list="{{own}}" as="it" hint-placeholder-count="2">
<div role="option" style="height: 56px; box-sizing: border-box; padding: 0 6px 0 8px; border-radius: 16px; display: flex; align-items: center; gap: 12px">
<sc-if value="{{images}}" hint-placeholder-val="{{ true }}"><div style="width: 40px; height: 40px; border-radius: 13px; background: {{k.thumb}}; box-shadow: {{k.thumbShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{it.img}}" hint-placeholder-val="{{ false }}"><img src="{{it.img}}" alt="" width="40" height="40" style="display: block; width: 40px; height: 40px"></sc-if><sc-if value="{{it.noImg}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.thumbIcon}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2 11h10.5l2-8H7"></path><circle cx="9.5" cy="19" r="1.2"></circle><circle cx="16.5" cy="19" r="1.2"></circle></svg></sc-if>
</div></sc-if>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 500; color: {{k.text}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.pre}}<b style="font-weight: 700; color: {{k.accentText}}">{{it.hit}}</b>{{it.post}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{k.sub}}; white-space: nowrap">{{it.meta}}<sc-if value="{{it.inList}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 7px; border-radius: 999px; background: {{k.hl}}; color: {{k.accentText}}; font-weight: 600">{{it.badge}}</span></sc-if></span>
</div>
<button aria-label="{{it.addLabel}}" style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gp.bg}}; box-shadow: {{gp.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gp.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gp.glow}}; filter: blur(2px); pointer-events: none"></span><svg style="position: relative; filter: {{gp.iconShadow}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gp.icon}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</sc-for>
</sc-if>
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<!-- Keine Treffer im eigenen Artikelstamm und im Produktkatalog -->
<span style="padding: 10px 10px; font-size: 14px; font-weight: 500; color: {{k.sub}}">Kein passender Artikel.</span>
</sc-if>
</div>

<!-- Eingabe direkt über der Tastatur: 12 Rand, 52 hoch, 8 Abstand zur Tastatur -->
<div style="position: absolute; left: 12px; right: 12px; bottom: 299px; height: 52px; display: flex; align-items: center; gap: 8px">
<label style="flex-grow: 1; height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 26px; background: {{k.fieldSolid}}; border: 1.5px solid {{k.ring}}; box-shadow: 0 0 0 4px {{k.ringSoft}}, 0 8px 20px -12px {{k.ringGlow}}; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<input type="text" aria-label="Artikel hinzufügen" value="{{q}}" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; font-weight: 500; color: {{k.text}}">
<button aria-label="Barcode scannen" style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gn.bg}}; box-shadow: {{gn.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gn.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gn.glow}}; filter: blur(2px); pointer-events: none"></span><svg style="position: relative; filter: {{gn.iconShadow}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg></button>
</label>
<button aria-label="Schließen" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: {{gn.bg}}; box-shadow: {{gn.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span style="position: absolute; left: 8px; right: 8px; top: 3px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, {{gn.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span style="position: absolute; left: 12px; right: 12px; bottom: 3px; height: 6px; border-radius: 50%; background: {{gn.glow}}; filter: blur(2px); pointer-events: none"></span><svg style="position: relative; filter: {{gn.iconShadow}}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gn.icon}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 291px; box-sizing: border-box; padding: 8px 3px 0 3px; background: {{k.kb}}; display: flex; flex-direction: column; gap: 11px; align-items: center">

<div style="display: flex; gap: 4px"><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">a</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">s</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">d</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">f</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">g</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">h</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">j</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">k</span><span style="width: 31px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: <div style="display: flex; gap: 4px"><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">y</span><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">x</span><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">c</span><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">v</span><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">b</span><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">n</span><span style="width: 40px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: {{k.kbText}}">m</span></div>
<div style="display: flex; gap: 6px"><span style="width: 90px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; opacity: 0.7"></span><span style="width: 180px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; display: flex; align-items: center; justify-content: center; font-size: 15px; color: {{k.kbText}}">Leerzeichen</span><span style="width: 90px; height: 42px; border-radius: 5px; background: {{k.kbKey}}; opacity: 0.7; display: flex; align-items: center; justify-content: center; font-size: 15px; color: {{k.kbText}}">Hinzufügen</span></div>
</div>
</div>
</x-dc>

      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      fieldFocus: '#FFFFFF', ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12), ringGlow: rgba(accent, 0.45),
      card: '#FFFFFF', cardBorder: '#EDF2F2', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 10px 22px -14px rgba(12,40,44,0.22)',
      thumb: 'linear-gradient(150deg, #F2F7F7, #E4EEEF)', thumbShadow: 'inset 0 1px 0 #ffffff', thumbIcon: '#7D9498',
      addBg: 'linear-gradient(180deg, #FFFFFF, ' + rgba(accent, 0.1) + ')', addBorder: rgba(accent, 0.25), addShadow: 'inset 0 1px 0 #ffffff, 0 6px 14px -8px ' + rgba(accent, 0.6),
      footer: 'linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 30%)', accentText: deep, pop: 'rgba(255,255,255,0.98)', fieldSolid: '#FFFFFF', popBorder: 'rgba(15,37,40,0.08)', popShadow: '0 24px 48px -16px rgba(12,40,44,0.35), 0 2px 6px rgba(12,40,44,0.06)', line: '#EDF1F2', scrimList: 'rgba(8,24,27,0.28)', kb: '#D1D4D9', kbKey: '#FFFFFF', kbText: '#0F2528', round: '#FFFFFF', roundBorder: '#E6EDEE', hl: rgba(accent, 0.16), closeSolid: '#F1F5F5'
    };

    // Glas-Knöpfe (Designsprache wie FAB): gp = Akzent (Primäraktion), gn = neutral (Schließen, Scannen, Leeren)
    const gp = {
      bg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      shadow: dark ? 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 14px -7px ' + rgba(accent, 0.55) : 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 16px -6px ' + rgba(accent, 0.7) + ', 0 0 18px ' + rgba(accent, 0.25),
      gloss: 'rgba(255,255,255,0.6)', glow: 'rgba(255,255,255,0.22)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(0,40,45,0.35))'
    };
    const gn = dark ? {
      bg: 'radial-gradient(circle at 32% 22%, #41575B 0%, #1F3033 50%, #111C1E 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 16px -8px rgba(0,0,0,0.8)',
      gloss: 'rgba(255,255,255,0.28)', glow: 'rgba(255,255,255,0.1)', icon: '#D3E6E8', iconShadow: 'none'
    } : {
      bg: 'radial-gradient(circle at 32% 22%, #FFFFFF 0%, #EEF4F5 50%, #D3DFE1 100%)',
      shadow: 'inset 0 -3px 6px rgba(12,40,44,0.12), 0 1px 2px rgba(12,40,44,0.08), 0 8px 16px -8px rgba(12,40,44,0.35)',
      gloss: 'rgba(255,255,255,0.95)', glow: 'rgba(255,255,255,0.6)', icon: '#1E3A3E', iconShadow: 'none'
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    const _unused = [
      { pre: '', hit: 'Milch', post: '', meta: 'Weihenstephan · 1 l', badge: 'Auf der Liste', inList: true },
      { pre: 'Soya', hit: 'milch', post: '', meta: 'alpro · 1 l', badge: '', inList: false },
      { pre: '', hit: 'Milch', post: ' Mandel ohne Zucker', meta: 'Lidl · 1 l', badge: '', inList: false },
      { pre: 'Kokos', hit: 'milch', post: '', meta: 'Freshona · 400 ml', badge: '', inList: false }
    ].map((i) => Object.assign({ addLabel: i.pre + i.hit + i.post + (i.inList ? ' – Menge erhöhen' : ' hinzufügen'), notInList: !i.inList }, i));
    const mk = (a) => a.map((i) => Object.assign({ addLabel: i.pre + i.hit + i.post + (i.inList ? ' – Menge erhöhen' : ' hinzufügen') }, i));
    const own = mk([
      { pre: 'Hafer', hit: 'mil', post: 'ch', meta: 'Oatly · 1 l', badge: '', inList: false },
      { pre: '', hit: 'Mil', post: 'ch', meta: 'Weihenstephan · 1 l', badge: 'Auf der Liste', inList: true }
    ]);
    const more = mk([
      { pre: 'Kokos', hit: 'mil', post: 'ch', meta: 'Freshona · 400 ml', badge: '', inList: false },
      { pre: '', hit: 'Mil', post: 'chreis', meta: 'Müller · 200 g', badge: '', inList: false }
    ]);
    const mode = this.props.results ?? 'some';
    const none = mode === 'none';
    const fruitOwn = mk([
      { pre: 'Or', hit: 'an', post: 'gen', meta: '4 Stück', badge: '', inList: false, img: 'assets/fruit/fruit.orange.svg' },
      { pre: 'B', hit: 'an', post: 'anen', meta: '6 Stück', badge: 'Auf der Liste', inList: true, img: 'assets/fruit/fruit.banana.svg' }
    ]);
    const fruitMore = mk([
      { pre: 'An', hit: 'an', post: 'as', meta: '1 Stück', badge: '', inList: false, img: 'assets/fruit/fruit.pineapple.svg' }
    ]);
    const withImg = (a) => a.map((i) => Object.assign({ noImg: !i.img }, i));
    const q = none ? 'Quinoa-Mehl' : (mode === 'fruit' ? 'an' : 'Mil');
    const images = (this.props.images ?? 'on') === 'on';
    return { images, k, gp, gn, cta, theme, accent, own: withImg(mode === 'fruit' ? fruitOwn : own), more: withImg(mode === 'fruit' ? fruitMore : more),
      hasResults: !none, noResults: none, q };
  }
}
