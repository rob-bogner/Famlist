<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Artikel suchen – leer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>

<section aria-label="Artikel suchen" style="position: absolute; left: 0; top: 54px; width: 390px; height: 790px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden">
<div style="padding: 10px 20px 0 20px; display: flex; flex-direction: column; align-items: center">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Artikel suchen</h1>
<button aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{k.close}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<label style="width: 100%; margin-top: 16px; height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 27px; background: {{k.fieldFocus}}; border: 1.5px solid {{k.ring}}; box-shadow: 0 0 0 4px {{k.ringSoft}}, 0 8px 20px -12px {{k.ringGlow}}; display: flex; align-items: center; gap: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<span style="width: 2px; height: 22px; border-radius: 1px; background: {{accent}}"></span>
<input type="text" aria-label="Artikel suchen" placeholder="Artikel suchen …" style="flex-grow: 1; min-width: 0; margin-left: -10px; border: 0; outline: none; background: transparent; font-size: 16px; color: {{k.text}}">
</label>
</div>

<div style="position: absolute; left: 0; right: 0; top: 150px; bottom: 384px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<div style="position: relative; width: 72px; height: 72px; border-radius: 24px; background: {{k.thumb}}; box-shadow: {{k.thumbShadow}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
<div style="position: absolute; left: -20px; top: -30px; width: 90px; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.5), rgba(255,255,255,0)); pointer-events: none"></div>
<svg style="position: relative" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{k.thumbIcon}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
</div>
<span style="font-size: 15px; font-weight: 500; color: {{k.sub}}; text-align: center; max-width: 240px; line-height: 1.4">Suche nach einem Artikel oder lege einen neuen an.</span>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 314px">
<button style="position: relative; width: 100%; height: 56px; border-radius: 28px; border: 0; padding: 0; background: {{cta.bg}}; box-shadow: {{cta.shadow}}; color: {{cta.text}}; font-size: 16px; font-weight: 600; cursor: pointer; overflow: hidden">
<span style="position: absolute; left: 24px; right: 24px; top: 2px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); pointer-events: none"></span>
<span style="position: relative">Neuen Artikel anlegen</span>
</button>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 300px; background: {{k.kb}}; display: flex; align-items: center; justify-content: center">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{k.kbText}}">iOS-Tastatur</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      fieldFocus: 'rgba(255,255,255,0.06)', ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.12), ringGlow: rgba(accent, 0.4),
      thumb: 'linear-gradient(150deg, ' + rgba(accent, 0.24) + ', ' + rgba(accent, 0.06) + ')', thumbShadow: 'inset 0 1px 0 rgba(255,255,255,0.14)', thumbIcon: light,
      kb: '#1C1F22', kbText: '#7E858C', accentText: light
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      fieldFocus: '#FFFFFF', ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12), ringGlow: rgba(accent, 0.45),
      thumb: 'linear-gradient(150deg, #F4F8F8, #E2ECED)', thumbShadow: 'inset 0 1px 0 #ffffff, 0 12px 24px -14px rgba(12,40,44,0.35)', thumbIcon: '#7D9498',
      kb: '#D5D8DD', kbText: '#6B7280', accentText: deep
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    return { k, cta, theme, accent };
  }
}
</script>
</body>
</html>
