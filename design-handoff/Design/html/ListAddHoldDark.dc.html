<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Plus gedrückt halten – Dock wird Auswahlmenü – Dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #071012">
<dc-import name="FabHold" variant="dock" theme="{{theme}}" accent="{{accent}}" preview="{{preview}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1FC2CC","options":["#1FC2CC","#4C8DFF","#8B6CFF","#FF8A4C"]},"theme":{"editor":"enum","default":"dark","options":["light","dark"]},"preview":{"editor":"range","default":1,"min":0,"max":1,"step":0.05},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1FC2CC', theme: this.props.theme ?? 'dark', preview: this.props.preview ?? 1 };
  }
}
</script>
</body>
</html>
