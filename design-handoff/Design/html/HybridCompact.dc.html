<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>My List – Kompakter Kopf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
input::placeholder{color:inherit;opacity:1}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">

<sc-if value="{{dark}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: -120px; top: 360px; width: 320px; height: 320px; border-radius: 50%; background: {{glowA}}; filter: blur(70px); pointer-events: none"></div>
<div style="position: absolute; right: -140px; top: 560px; width: 300px; height: 300px; border-radius: 50%; background: rgba(90,120,255,0.14); filter: blur(80px); pointer-events: none"></div>
</sc-if>

<!-- ===== Zustand: oben (ausgeklappter Glas-Kopf) ===== -->
<sc-if value="{{top}}" hint-placeholder-val="{{ false }}">
<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 62px 20px 4px 20px; border-radius: 0 0 30px 30px; background: {{heroBg}}; overflow: hidden; display: flex; flex-direction: column; gap: 16px">
<div style="position: absolute; left: -60px; top: -120px; width: 320px; height: 240px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.42), rgba(255,255,255,0)); pointer-events: none"></div>
<div style="position: absolute; right: -60px; top: 30px; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.14); pointer-events: none"></div>
<div style="position: absolute; right: -10px; top: 80px; width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); pointer-events: none"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none"></div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Liste wechseln" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; cursor: pointer; color: #ffffff">
<span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8)">Aktuelle Liste</span>
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">My List<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>
<div style="display: flex; gap: 8px">
<button aria-label="Ansicht wechseln" style="width: 44px; height: 44px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.38); background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="7" rx="2"></rect><path d="M4 15.5h16M4 19.5h16"></path></svg>
</button>
<button aria-label="Mehr" style="width: 44px; height: 44px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.38); background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"></path></svg>
</button>
</div>
</div>

<div style="position: relative; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.92)">1 von 6 Artikeln</span>
<span style="font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 600; color: #ffffff; letter-spacing: -0.03em">17<span style="font-size: 15px; opacity: 0.8"> %</span></span>
</div>
<div role="progressbar" aria-valuenow="17" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt" style="position: relative; height: 10px; border-radius: 999px; background: rgba(0,35,40,0.3); box-shadow: 0 1px 0 rgba(255,255,255,0.25)">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 17%; border-radius: 999px; background: linear-gradient(90deg, rgba(255,255,255,0.75), #ffffff)"></div>
</div>
</div>

<label style="position: relative; height: 50px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 25px; background: {{sField}}; border: 1px solid {{sBorder}}; box-shadow: {{sShadow}}; display: flex; align-items: center; gap: 12px; color: {{sPlaceholder}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{sIcon}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<input type="text" aria-label="Artikel suchen oder hinzufügen" placeholder="Artikel suchen oder hinzufügen" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: {{sText}}">
<span style="width: 38px; height: 38px; border-radius: 50%; background: {{sScanBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{sScanIcon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>
</span>
</label>
<div role="tablist" style="position: relative; display: flex; gap: 26px; padding: 0 4px; margin-top: -2px">
<button role="tab" aria-selected="true" style="position: relative; border: 0; background: transparent; padding: 8px 0 11px 0; font-size: 15px; font-weight: 600; color: #ffffff; cursor: pointer">Alle<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: #ffffff"></span></button>
<button role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 8px 0 11px 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.8); cursor: pointer">Offen</button>
<button role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 8px 0 11px 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.8); cursor: pointer">Erledigt</button>
</div>
</header>
</sc-if>

<!-- ===== Liste ===== -->
<div style="position: absolute; left: 0; top: {{listTop}}; width: 390px; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 30px; height: 30px; border-radius: 10px; background: {{chipGrad}}; box-shadow: {{chipShadow}}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="8" cy="8" r="1.4"></circle></svg>
</div>
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 600; color: {{t.text}}">Sonstiges</h2>
<span style="font-size: 14px; font-weight: 600; color: {{t.sub}}">5</span>
</div>
<button style="border: 0; background: transparent; padding: 10px 0 10px 10px; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: {{accentText}}; cursor: pointer">Alle abhaken<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accentText}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<div style="position: relative; height: 94px; box-sizing: border-box; padding: 14px; border-radius: 24px; background: {{t.card}}; border: 1px solid {{t.cardBorder}}; box-shadow: {{t.cardShadow}}; display: flex; align-items: center; gap: 16px; flex-shrink: 0">
<div style="width: 64px; height: 64px; border-radius: 18px; background: {{t.thumb}}; box-shadow: {{t.thumbShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.thumbIcon}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M9.5 5h5l1.5 2H19a2 2 0 0 1 2 2v8.5M17 19H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2"></path><path d="M9.9 10.2a3 3 0 0 0 4 4"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0; align-items: flex-start">
<span style="font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600; color: {{t.text}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{it.name}}</span>
<span style="padding: 4px 11px; border-radius: 999px; background: {{t.chipBg}}; color: {{accentText}}; font-size: 13px; font-weight: 600; box-shadow: {{t.chipInset}}">{{it.qty}}</span>
</div>
<button aria-label="{{it.checkLabel}}" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid {{t.checkRing}}; background: {{t.checkBg}}; box-shadow: {{t.checkShadow}}; padding: 0; cursor: pointer; flex-shrink: 0"></button>
</div>
</sc-for>

<!-- Erledigte: eingeklappt am Ende statt eigener Tab -->
<button style="margin-top: 6px; height: 52px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 20px; border: 1px dashed {{t.doneBorder}}; background: {{t.doneBg}}; display: flex; align-items: center; gap: 10px; cursor: pointer; color: {{t.sub}}; flex-shrink: 0">
<span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 10px; background: {{t.search}}; border: 1px solid {{t.searchBorder}}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span style="flex-grow: 1; text-align: left; font-size: 15px; font-weight: 600">Abgehakte Artikel · 1</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.sub}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>

<!-- ===== Zustand: gescrollt (kompakter, schwebender Kopf) ===== -->
<sc-if value="{{scrolled}}" hint-placeholder-val="{{ true }}">
<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; padding: 58px 20px 4px 20px; border-radius: 0 0 30px 30px; background: {{heroBg}}; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
<div style="position: absolute; left: -60px; top: -120px; width: 320px; height: 240px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.42), rgba(255,255,255,0)); pointer-events: none"></div>
<div style="position: absolute; right: -60px; top: 30px; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.14); pointer-events: none"></div>
<div style="position: absolute; right: -10px; top: 80px; width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); pointer-events: none"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none"></div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Liste wechseln" style="border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #ffffff; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">My List<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display: flex; gap: 8px">
<button aria-label="Artikel suchen oder hinzufügen" style="width: 44px; height: 44px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.38); background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
</button>
<button aria-label="Mehr" style="width: 44px; height: 44px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.38); background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"></path></svg>
</button>
</div>
</div>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<div role="progressbar" aria-valuenow="17" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt" style="position: relative; flex-grow: 1; height: 8px; border-radius: 999px; background: rgba(0,35,40,0.3); box-shadow: 0 1px 0 rgba(255,255,255,0.25)">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 17%; border-radius: 999px; background: linear-gradient(90deg, rgba(255,255,255,0.75), #ffffff)"></div>
</div>
<span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap">1 von 6</span>
<span style="min-width: 44px; height: 26px; box-sizing: border-box; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.32); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); color: #ffffff; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">17 %</span>
</div>
<div role="tablist" style="position: relative; display: flex; gap: 26px; padding: 0 4px; margin-top: -2px">
<button role="tab" aria-selected="true" style="position: relative; border: 0; background: transparent; padding: 8px 0 11px 0; font-size: 15px; font-weight: 600; color: #ffffff; cursor: pointer">Alle<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: #ffffff"></span></button>
<button role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 8px 0 11px 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.8); cursor: pointer">Offen</button>
<button role="tab" aria-selected="false" style="border: 0; background: transparent; padding: 8px 0 11px 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.8); cursor: pointer">Erledigt</button>
</div>
</header>
</sc-if>

<!-- Ausblendung unter dem Dock -->
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: {{fade}}; pointer-events: none"></div>

<!-- ===== Dock (unverändert) ===== -->
<div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: center; gap: 12px">
<nav style="position: relative; flex-grow: 1; height: 68px; box-sizing: border-box; border-radius: 34px; background: {{t.nav}}; border: 1px solid {{t.navBorder}}; box-shadow: {{t.navShadow}}; backdrop-filter: blur(24px) saturate(160%); display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 7px; overflow: hidden">
<div style="position: absolute; left: 24px; right: 24px; top: 0; height: 26px; border-radius: 0 0 40px 40px; background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0)); pointer-events: none"></div>
<a href="#" aria-current="page" style="position: relative; height: 52px; padding: 0 18px 0 14px; border-radius: 26px; background: {{t.navActive}}; box-shadow: {{t.navActiveShadow}}; display: flex; align-items: center; gap: 8px; text-decoration: none; color: {{t.navActiveText}}; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.navActiveText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 1.8-2M4 12l1 1 1.8-2"></path><circle cx="5" cy="18" r="1"></circle></svg>Liste</a>
<button aria-label="Sortieren" style="position: relative; width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.navIcon}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19V5M4.5 8.5 8 5l3.5 3.5M16 5v14M12.5 15.5 16 19l3.5-3.5"></path></svg>
</button>
<button aria-label="Liste duplizieren" style="position: relative; width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.navIcon}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
</button>
<button aria-label="Erledigte löschen" style="position: relative; width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.navIcon}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 11.2a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7M10 11v5M14 11v5"></path></svg>
</button>
</nav>
<button aria-label="Artikel hinzufügen" style="position: relative; width: 68px; height: 68px; border-radius: 50%; border: 0; padding: 0; background: {{fabBg}}; box-shadow: {{fabShadow}}; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<span style="position: absolute; left: 12px; right: 12px; top: 4px; height: 26px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0)); pointer-events: none"></span>
<span style="position: absolute; left: 18px; right: 18px; bottom: 4px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.22); filter: blur(3px); pointer-events: none"></span>
<svg style="position: relative" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","default":"scrolled","options":["scrolled","top"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const top = (this.props.state ?? 'scrolled') === 'top';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const deeper = mix(accent, 0, 0.6);

    const t = dark ? {
      bg: 'radial-gradient(120% 60% at 50% 100%, ' + rgba(accent, 0.1) + ', rgba(0,0,0,0) 60%), #071012',
      text: '#EAF5F6', sub: '#93ADB1', icon: '#D3E6E8', line: 'rgba(255,255,255,0.08)',
      round: 'linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04))', roundBorder: 'rgba(255,255,255,0.1)', roundShadow: 'inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px -8px rgba(0,0,0,0.7)',
      search: 'rgba(255,255,255,0.05)', searchBorder: 'rgba(255,255,255,0.08)', searchShadow: 'inset 0 1px 0 rgba(255,255,255,0.05)', scanBg: rgba(accent, 0.16),
      card: 'linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03))', cardBorder: 'rgba(255,255,255,0.09)',
      cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.1), 0 18px 36px -12px rgba(0,0,0,0.7)',
