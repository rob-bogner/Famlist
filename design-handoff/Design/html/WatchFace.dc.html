<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Watch – Zifferblatt & Smart Stack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<!-- Apple Watch 46 mm: 208 × 248 pt · watchOS ist immer dunkel -->
<div style="width: 208px; height: 248px; position: relative; overflow: hidden; background: radial-gradient(120% 70% at 50% 110%, {{w.glow}}, rgba(0,0,0,0) 60%), #000000; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif">
<div style="position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-family: 'Outfit', sans-serif; font-size: 64px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: #FFFFFF">10:09</div>
<span style="position: absolute; left: 0; right: 0; top: 88px; text-align: center; font-size: 13px; font-weight: 600; color: {{w.accentText}}">FR 25</span>
<div style="position: absolute; left: 10px; right: 10px; top: 116px; height: 72px; box-sizing: border-box; padding: 10px 12px; border-radius: 20px; background: {{w.card}}; border: 1px solid {{w.cardBorder}}; box-shadow: {{w.cardShadow}}; display: flex; flex-direction: column; gap: 5px"><span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{w.accentText}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{w.accentText}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2 11h10.5l2-8H7"></path></svg>Famlist</span><span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.1">My List · 4 offen</span><span style="height: 5px; border-radius: 3px; background: {{w.track}}; overflow: hidden"><span style="display: block; width: 33%; height: 5px; border-radius: 3px; background: {{w.fill}}"></span></span></div>
<div style="position: absolute; left: 22px; right: 22px; bottom: 12px; display: flex; justify-content: space-between"><span style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 38 38" style="flex-shrink: 0"><circle cx="19.0" cy="19.0" r="17.0" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="4"></circle><circle cx="19.0" cy="19.0" r="17.0" fill="none" stroke="{{w.accentText}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="106.81" stroke-dashoffset="71.21" transform="rotate(-90 19.0 19.0)"></circle><text x="19.0" y="23.0" text-anchor="middle" font-family="DM Sans" font-size="11" font-weight="600" fill="#FFFFFF">4</text></svg></span><span style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{w.accentText}}" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1FC2CC","options":["#1FC2CC","#4C8DFF","#8B6CFF","#FF8A4C"]},"$preview":{"width":208,"height":248}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1FC2CC';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, 0.5);
    const w = {
      accent, accentText: light, glow: rgba(accent, 0.16),
      card: 'linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08))', cardBorder: 'rgba(255,255,255,0.08)',
      cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.12)',
      sub: 'rgba(255,255,255,0.6)', faint: 'rgba(255,255,255,0.4)', line: 'rgba(255,255,255,0.12)',
      track: 'rgba(255,255,255,0.14)', ring: rgba(accent, 0.55),
      fill: 'linear-gradient(90deg, ' + light + ', ' + accent + ')',
      fab: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      fabShadow: 'inset 0 -3px 8px rgba(0,30,34,0.3), 0 0 14px ' + rgba(accent, 0.35),
      checkFill: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 55%, ' + deep + ' 100%)',
      glassBtn: 'linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1))', glassBorder: 'rgba(255,255,255,0.16)',
      chip: rgba(accent, 0.2), chipText: light
    };
    return { w };
  }
}
</script>
</body>
</html>
