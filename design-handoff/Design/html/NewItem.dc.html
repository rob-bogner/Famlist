<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Neuer Artikel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>

<section aria-label="Neuer Artikel" style="position: absolute; left: 0; top: 54px; width: 390px; height: 790px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden; padding: 10px 20px 0 20px; display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Neuer Artikel</h1>
<button aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{k.close}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="margin-top: 18px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; gap: 14px; align-items: stretch">
<button style="width: 104px; height: 104px; border-radius: 26px; border: 1.5px dashed {{k.dashed}}; background: {{k.field}}; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; flex-shrink: 0; color: {{k.sub}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"></path><circle cx="12" cy="12.5" r="3.5"></circle></svg>
<span style="font-size: 12px; font-weight: 600">Foto hinzufügen</span>
</button>
<label style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}; padding-left: 4px">Name</span>
<input type="text" value="Milch" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid {{k.ring}}; box-shadow: 0 0 0 4px {{k.ringSoft}}; background: {{k.fieldFocus}}; font-size: 16px; font-weight: 500; color: {{k.text}}; outline: none">
</label>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}; padding-left: 4px">Menge</span>
<div style="display: flex; gap: 10px">
<div style="width: 148px; height: 52px; box-sizing: border-box; padding: 0 5px; border-radius: 26px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<button aria-label="Menge verringern" disabled style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: {{k.stepOff}}; padding: 0; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{k.stepOffIcon}}" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
</button>
<span style="font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600">1</span>
<button aria-label="Menge erhöhen" style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; background: {{step.bg}}; box-shadow: {{step.shadow}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden">
<span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none"></span>
<svg style="position: relative" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<button aria-label="Maßeinheit wählen" style="flex-grow: 1; height: 52px; box-sizing: border-box; padding: 0 14px 0 16px; border-radius: 16px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 16px; color: {{k.sub}}">Maßeinheit<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{k.sub}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}; padding-left: 4px">Kategorie</span>
<div style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<button style="height: 42px; padding: 0 16px 0 12px; border-radius: 21px; border: 1px solid {{k.fieldBorder}}; background: {{k.chip}}; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-size: 15px; font-weight: 500; color: {{k.text}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"></path></svg>{{c.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
<button style="position: relative; width: 100%; height: 56px; border-radius: 28px; border: 0; padding: 0; background: {{cta.bg}}; box-shadow: {{cta.shadow}}; color: {{cta.text}}; font-size: 16px; font-weight: 600; cursor: pointer; overflow: hidden">
<span style="position: absolute; left: 24px; right: 24px; top: 2px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); pointer-events: none"></span>
<span style="position: relative">Zur Liste hinzufügen</span>
</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)', fieldFocus: 'rgba(255,255,255,0.06)', ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.12),
      dashed: rgba(accent, 0.45), chip: 'rgba(255,255,255,0.05)', stepOff: 'rgba(255,255,255,0.06)', stepOffIcon: 'rgba(255,255,255,0.3)', accentText: light
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      field: '#F4F7F7', fieldBorder: '#E6EDEE', fieldFocus: '#FFFFFF', ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12),
      dashed: rgba(accent, 0.45), chip: '#F4F7F7', stepOff: '#E8EEEF', stepOffIcon: '#A9B8BA', accentText: deep
    };
    const step = {
      bg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 50%, ' + deep + ' 100%)',
      shadow: 'inset 0 -2px 5px rgba(0,30,34,0.25), 0 6px 12px -6px ' + rgba(accent, dark ? 0.5 : 0.8)
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    const cats = [
      { label: 'Obst & Gemüse', icon: 'M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19l8-8' },
      { label: 'Milchprodukte', icon: 'M12 3.5s-6 6.6-6 10.5a6 6 0 0 0 12 0c0-3.9-6-10.5-6-10.5z' },
      { label: 'Backwaren', icon: 'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1.5-3 4-3 7h3' }
    ];
    return { k, step, cta, cats, theme, accent };
  }
}
</script>
</body>
</html>
