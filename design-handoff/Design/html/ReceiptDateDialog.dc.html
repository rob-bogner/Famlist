    const heroBg = 'linear-gradient(150deg, ' + light + ' 0%, ' + accent + ' 42%, ' + (dark ? mix(accent, 0, 0.6) : deep) + ' 100%)';
    // Glas-Knöpfe (Designsprache wie FAB): gp = Akzent, gn = neutral, gnd = neutral dunkel (Kamera/Bild), gd = Gefahr
    const gp = {
      bg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      pbg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 50%, ' + deep + ' 100%)',
      shadow: dark ? 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 14px -7px ' + rgba(accent, 0.55) : 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 16px -6px ' + rgba(accent, 0.7) + ', 0 0 18px ' + rgba(accent, 0.25),
      gloss: 'rgba(255,255,255,0.6)', glow: 'rgba(255,255,255,0.22)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(0,40,45,0.35))'
    };
    const gnDark = {
      bg: 'radial-gradient(circle at 32% 22%, #41575B 0%, #1F3033 50%, #111C1E 100%)',
      pbg: 'linear-gradient(180deg, #33474A 0%, #1F3033 55%, #152326 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 16px -8px rgba(0,0,0,0.8)',
      gloss: 'rgba(255,255,255,0.28)', glow: 'rgba(255,255,255,0.1)', icon: '#D3E6E8', iconShadow: 'none'
    };
    const gn = dark ? gnDark : {
      bg: 'radial-gradient(circle at 32% 22%, #FFFFFF 0%, #EEF4F5 50%, #D3DFE1 100%)',
      pbg: 'linear-gradient(180deg, #FFFFFF 0%, #EEF4F5 55%, #DCE6E8 100%)',
      shadow: 'inset 0 -3px 6px rgba(12,40,44,0.12), 0 1px 2px rgba(12,40,44,0.08), 0 8px 16px -8px rgba(12,40,44,0.35)',
      gloss: 'rgba(255,255,255,0.95)', glow: 'rgba(255,255,255,0.6)', icon: '#1E3A3E', iconShadow: 'none'
    };
    const gnd = gnDark;
    const gd = {
      bg: 'radial-gradient(circle at 32% 22%, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      pbg: 'linear-gradient(180deg, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4), 0 10px 20px -10px rgba(229,72,77,0.6)',
      gloss: 'rgba(255,255,255,0.5)', glow: 'rgba(255,255,255,0.2)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(80,0,0,0.3))'
    };
    // Aktionskarte (ersetzt iOS-Systemdialoge): Fläche wie „Artikel erkannt“, Abdunkelung wie Sheets
    const dc = dark ? {
      scrim: 'rgba(0,0,0,0.55)', bg: 'rgba(20,34,37,0.97)', border: 'rgba(255,255,255,0.1)', shadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 24px 48px -16px rgba(0,0,0,0.8)',
      text: '#EAF5F6', sub: '#93ADB1', line: 'rgba(255,255,255,0.08)', field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)',
      danger: '#FF7A7E', dangerSoft: 'rgba(255,122,126,0.14)', warn: '#F2B24C', warnSoft: 'rgba(242,178,76,0.14)', info: light, infoSoft: rgba(accent, 0.16),
      ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.14), chip: rgba(accent, 0.16), strike: 'rgba(147,173,177,0.8)'
    } : {
      scrim: 'rgba(8,24,27,0.42)', bg: 'rgba(255,255,255,0.97)', border: 'rgba(15,37,40,0.08)', shadow: '0 24px 48px -16px rgba(12,40,44,0.35)',
      text: '#0F2528', sub: '#5F7579', line: '#EDF1F2', field: '#F4F7F7', fieldBorder: '#E6EDEE',
      danger: '#C8363B', dangerSoft: 'rgba(200,54,59,0.08)', warn: '#B7791F', warnSoft: 'rgba(183,121,31,0.1)', info: deep, infoSoft: rgba(accent, 0.1),
      ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12), chip: rgba(accent, 0.1), strike: 'rgba(95,117,121,0.8)'
    };
    return { dc, gp, gn, gnd, gd, k, cta, theme, accent, bg, heroBg, avatarBg: 'linear-gradient(150deg, ' + light + ', ' + deep + ')' };
  }
}
