<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Artikel verwalten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
input::placeholder{color:inherit;opacity:1}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>

<section aria-label="Artikel verwalten" style="position: absolute; left: 0; top: 54px; width: 390px; height: 790px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden">
<div style="padding: 10px 20px 0 20px; display: flex; flex-direction: column; align-items: center">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Artikel verwalten</h1>
<button aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{k.close}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<label style="width: 100%; margin-top: 16px; height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 25px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; align-items: center; gap: 12px; color: {{k.sub}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{k.sub}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<input type="text" aria-label="Gespeicherte Artikel durchsuchen" placeholder="Gespeicherte Artikel durchsuchen" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: {{k.sub}}">
</label>
<div style="width: 100%; margin-top: 12px; margin-right: -20px; display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button style="height: 36px; padding: 0 14px; box-sizing: border-box; border-radius: 18px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; font-size: 14px; font-weight: {{f.weight}}; white-space: nowrap; flex-shrink: 0; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</div>

<div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}">6 Artikel</span>
<span style="font-size: 12px; color: {{k.sub}}">Tippen = bearbeiten · wischen = löschen</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<button style="width: 100%; box-sizing: border-box; padding: 10px 12px 10px 10px; border-radius: 22px; background: {{k.card}}; border: 1px solid {{k.cardBorder}}; box-shadow: {{k.cardShadow}}; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; color: {{k.text}}">
<span style="width: 52px; height: 52px; border-radius: 16px; background: {{k.thumb}}; box-shadow: {{k.thumbShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{k.thumbIcon}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M9.5 5h5l1.5 2H19a2 2 0 0 1 2 2v8.5M17 19H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2"></path><path d="M9.9 10.2a3 3 0 0 0 4 4"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
<span style="font-size: 13px; color: {{k.sub}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.meta}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.sub}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: {{k.fade}}; pointer-events: none"></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)',
      card: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03))', cardBorder: 'rgba(255,255,255,0.08)', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px -14px rgba(0,0,0,0.7)',
      thumb: 'linear-gradient(150deg, ' + rgba(accent, 0.22) + ', ' + rgba(accent, 0.06) + ')', thumbShadow: 'inset 0 1px 0 rgba(255,255,255,0.12)', thumbIcon: light,
      chipOnBg: 'linear-gradient(180deg, ' + light + ', ' + accent + ')', chipOnText: '#04262A', chipOffBg: 'rgba(255,255,255,0.05)',
      fade: 'linear-gradient(180deg, rgba(10,20,22,0) 0%, #0A1416 85%)', accentText: light
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      field: '#F4F7F7', fieldBorder: '#E6EDEE',
      card: '#FFFFFF', cardBorder: '#EDF2F2', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 10px 22px -14px rgba(12,40,44,0.22)',
      thumb: 'linear-gradient(150deg, #F2F7F7, #E4EEEF)', thumbShadow: 'inset 0 1px 0 #ffffff', thumbIcon: '#7D9498',
      chipOnBg: 'linear-gradient(180deg, ' + accent + ', ' + deep + ')', chipOnText: '#FFFFFF', chipOffBg: '#F4F7F7',
      fade: 'linear-gradient(180deg, rgba(255,255,255,0) 0%, #FFFFFF 85%)', accentText: deep
    };
    const filters = ['Alle', 'Milchprodukte', 'Obst & Gemüse', 'Backwaren', 'Sonstiges'].map((label, i) => ({
      label,
      bg: i === 0 ? k.chipOnBg : k.chipOffBg,
      color: i === 0 ? k.chipOnText : k.text,
      border: i === 0 ? 'transparent' : k.fieldBorder,
      weight: i === 0 ? '600' : '500'
    }));
    const items = [
      { name: 'Bio Vollmilch-Schokolade', meta: 'Fairglobe · 100 g' },
      { name: 'Butter', meta: 'Sonstiges · 1 Packung' },
      { name: 'Kerrygold, original irische Butter aus Weidemilch', meta: 'Kerrygold · 250 g' },
      { name: 'Kokosmilch', meta: 'Freshona · 400 ml' },
      { name: 'Milch Mandel ohne Zucker', meta: 'Lidl · 1 l' },
      { name: 'Soyamilch', meta: 'alpro · 1 l' }
    ];
    return { k, filters, items, theme, accent };
  }
}
</script>
</body>
</html>
