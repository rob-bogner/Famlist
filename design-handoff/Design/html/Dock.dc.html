<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<!-- Dock 350 × 64 · Leiste 276 × 64 (Innenabstand 5, Radius 32) · 4 Aktionen, verteilt mit space-between
     Genau EIN Knopf ist ausgewählt: Pille 54 hoch mit Highlight + Beschriftung (Breite je Aktion fest: Abhaken 124, Sortieren 112, Kopieren 112, Löschen 104)
     Alle anderen: 44er-Icon ohne Fläche. Ruhezustand = „Alle abhaken“ ausgewählt. FAB 64 · Abstand 10 -->
<div style="width: 350px; height: 64px; display: flex; align-items: center; gap: 10px; font-family: 'DM Sans', system-ui, sans-serif">
<nav aria-label="Listen-Aktionen" style="position: relative; width: 276px; height: 64px; box-sizing: border-box; border-radius: 32px; background: {{t.nav}}; border: 1px solid {{t.navBorder}}; box-shadow: {{t.navShadow}}; backdrop-filter: blur(24px) saturate(160%); display: flex; align-items: center; justify-content: space-between; padding: 4px; overflow: hidden">
<sc-for list="{{items}}" as="b" hint-placeholder-count="4">
<button aria-label="{{b.label}}" aria-pressed="{{b.selected}}" aria-disabled="{{b.disabled}}" style="position: relative; width: {{b.w}}; height: {{b.h}}; box-sizing: border-box; padding: 0; border-radius: 27px; background: {{b.bg}}; border: 1px solid {{b.border}}; box-shadow: {{b.shadow}}; opacity: {{b.opacity}}; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: {{b.color}}; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; flex-shrink: 0">
<svg aria-hidden="true" width="{{b.iconSize}}" height="{{b.iconSize}}" viewBox="0 0 24 24" fill="none" stroke="{{b.color}}" stroke-width="{{b.stroke}}" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
<sc-if value="{{b.showText}}" hint-placeholder-val="{{ false }}"><span>{{b.text}}</span></sc-if>
</button>
</sc-for>
</nav>
<button aria-label="Neuer Artikel" style="position: relative; width: 64px; height: 64px; border-radius: 50%; border: 0; padding: 0; background: {{fabBg}}; box-shadow: {{fabShadow}}; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<span style="position: absolute; left: 11px; right: 11px; top: 4px; height: 24px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0)); pointer-events: none"></span>
<span style="position: absolute; left: 17px; right: 17px; bottom: 4px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.22); filter: blur(3px); pointer-events: none"></span>
<svg style="position: relative; filter: drop-shadow(0 2px 3px rgba(0,40,45,0.35))" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"active":{"editor":"enum","default":"none","options":["none","sort","copy","copied","delete"]},"pill":{"editor":"enum","default":"open","options":["open","allDone","empty"]},"$preview":{"width":350,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const active = this.props.active ?? 'none';
    const pillState = this.props.pill ?? 'open';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);

    // Leiste: in beiden Modi dunkles Glas
    const t = dark ? {
      nav: 'rgba(22,36,39,0.78)', navBorder: 'rgba(255,255,255,0.1)', navShadow: 'inset 0 1px 0 rgba(255,255,255,0.1), 0 24px 44px -12px rgba(0,0,0,0.85)'
    } : {
      nav: 'rgba(15,27,29,0.84)', navBorder: 'rgba(255,255,255,0.1)', navShadow: 'inset 0 1px 0 rgba(255,255,255,0.12), 0 20px 36px -12px rgba(12,30,33,0.5)'
    };
    const icon = '#D3E6E8';
    const empty = pillState === 'empty';
    const sel = (active === 'none') ? 'check' : (active === 'copied' ? 'copy' : active);

    const hiAccent = {
      bg: 'linear-gradient(180deg, ' + rgba(accent, 0.55) + ', ' + rgba(accent, 0.22) + ')', border: 'rgba(255,255,255,0.22)',
      shadow: 'inset 0 -1px 0 rgba(0,0,0,0.2), 0 0 16px ' + rgba(accent, 0.3), color: '#FFFFFF'
    };
    const hiDanger = {
      bg: 'linear-gradient(180deg, rgba(229,72,77,0.6), rgba(229,72,77,0.24))', border: 'rgba(255,255,255,0.22)',
      shadow: 'inset 0 -1px 0 rgba(0,0,0,0.2), 0 0 16px rgba(229,72,77,0.3)', color: '#FFFFFF'
    };
    const plain = { bg: 'transparent', border: 'transparent', shadow: 'none', color: icon };
    const checks = 'M18 6 7 17l-5-5M22 10l-7.5 7.5L13 16';
    const defs = [
      pillState === 'allDone'
        ? { key: 'check', text: 'Zurücksetzen', label: 'Alle Artikel wieder öffnen', icon: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5', w: 124 }
        : { key: 'check', text: 'Alle abhaken', label: 'Alle Artikel abhaken', icon: checks, w: 124 },
      { key: 'sort', text: 'Sortieren', label: 'Sortieren', icon: 'M8 19V5M4.5 8.5 8 5l3.5 3.5M16 5v14M12.5 15.5 16 19l3.5-3.5', w: 112 },
      active === 'copied'
        ? { key: 'copy', text: 'Kopiert', label: 'Kopiert', icon: 'M5 12.5l4.5 4.5L19 7.5', w: 112 }
        : { key: 'copy', text: 'Kopieren', label: 'In Zwischenablage kopieren', icon: 'M9 3.5h6a1 1 0 0 1 1 1V6a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1zM16 5h1.5A1.5 1.5 0 0 1 19 6.5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-13A1.5 1.5 0 0 1 6.5 5H8M9 12h6M9 16h4', w: 112 },
      { key: 'delete', text: 'Löschen', label: 'Artikel löschen', icon: 'M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 11.2a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7M10 11v5M14 11v5', w: 104 }
    ];
    const items = defs.map((d) => {
      const on = d.key === sel;
      const dis = empty && d.key !== 'sort';
      const look = on ? (d.key === 'delete' ? hiDanger : hiAccent) : plain;
      return Object.assign({}, d, look, {
        selected: on ? 'true' : 'false', showText: on,
        w: on ? d.w + 'px' : '44px', h: on ? '54px' : '44px',
        iconSize: on ? '18' : '22', stroke: on ? '2.2' : '1.9',
        disabled: dis ? 'true' : 'false', opacity: dis ? (on ? '0.4' : '0.35') : '1'
      });
    });
    // Leere Liste: ausgewählte Pille ohne Glow
    if (empty) items[0].shadow = 'none';

    return {
      t, items,
      fabBg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      fabShadow: dark
        ? 'inset 0 -4px 10px rgba(0,30,34,0.3), 0 12px 22px -10px ' + rgba(accent, 0.55) + ', 0 0 14px ' + rgba(accent, 0.18)
        : 'inset 0 -4px 10px rgba(0,30,34,0.3), 0 16px 28px -8px ' + rgba(accent, 0.75) + ', 0 0 36px ' + rgba(accent, 0.35)
    };
  }
}
</script>
</body>
</html>
