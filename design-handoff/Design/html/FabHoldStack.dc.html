<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Plus halten – A Stapel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFFFFF">
<dc-import name="FabHold" variant="stack" theme="{{theme}}" accent="{{accent}}" preview="{{preview}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"preview":{"editor":"range","default":1,"min":0,"max":1,"step":0.05},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0FA3AE', theme: this.props.theme ?? 'light', preview: this.props.preview ?? 1 };
  }
}
</script>
</body>
</html>
