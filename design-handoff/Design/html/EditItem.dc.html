<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Artikel bearbeiten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
input::placeholder{color:inherit;opacity:0.75}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>

<section aria-label="Artikel bearbeiten" style="position: absolute; left: 0; top: 118px; width: 390px; height: 726px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden; padding: 10px 20px 0 20px; display: flex; flex-direction: column">
<div style="position: relative; z-index: 2; align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin: 12px -20px 0 -20px; padding: 0 20px {{q.headPad}} 20px; background: {{q.headBg}}; box-shadow: 0 -40px 0 {{q.headBg}}">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Artikel bearbeiten</h1>
<button aria-label="Schließen" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: {{gn.bg}}; box-shadow: {{gn.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span aria-hidden="true" style="position: absolute; left: 8px; right: 8px; top: 3px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, {{gn.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 3px; height: 6px; border-radius: 50%; background: {{gn.glow}}; filter: blur(2px); pointer-events: none"></span><span style="position: relative; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gn.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</span></button>
</div>

<!-- Tastatur offen: Inhalt scrollt nach oben, bis die Menge über der Schnellwahl-Leiste steht -->
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 16px; transform: translateY({{q.shift}})">
<div style="display: flex; gap: 14px">
<button style="width: 104px; height: 104px; border-radius: 26px; border: 1.5px dashed {{k.dashed}}; background: {{k.field}}; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; flex-shrink: 0; color: {{k.sub}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"></path><circle cx="12" cy="12.5" r="3.5"></circle></svg>
<span style="font-size: 12px; font-weight: 600">Foto hinzufügen</span>
</button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<input type="text" aria-label="Name" value="Butter" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; font-size: 16px; font-weight: 500; color: {{k.text}}; outline: none">
<input type="text" aria-label="Marke" placeholder="Marke" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; font-size: 16px; color: {{k.sub}}; outline: none">
</div>
</div>
<input type="text" aria-label="Beschreibung" placeholder="Beschreibung" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; font-size: 16px; color: {{k.sub}}; outline: none; margin-top: -6px">

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}; padding-left: 4px">Kategorie</span>
<div style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<button style="height: 42px; padding: 0 16px 0 12px; border-radius: 21px; border: 1px solid {{k.fieldBorder}}; background: {{k.chip}}; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-size: 15px; font-weight: 500; color: {{k.text}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"></path></svg>{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}; padding-left: 4px">Menge</span>
<div style="display: flex; gap: 10px">
<!-- Zahl antippen → direkt eintippen (Ziffernblock). ± springt je nach Einheit: g/ml 50, sonst 1 (Menge ist ganzzahlig) -->
<div style="width: 148px; height: 52px; box-sizing: border-box; padding: 0 5px; border-radius: 26px; background: {{q.bg}}; border: {{q.border}}; box-shadow: {{q.ring}}; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<button aria-label="Menge verringern" disabled style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gn.bg}}; box-shadow: {{gn.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span aria-hidden="true" style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gn.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span aria-hidden="true" style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gn.glow}}; filter: blur(2px); pointer-events: none"></span><span style="position: relative; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{k.stepOffIcon}}" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
</span></button>
<span style="display: flex; align-items: center; gap: 1px; font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600">{{q.value}}<sc-if value="{{amount}}" hint-placeholder-val="{{ false }}"><span style="width: 2px; height: 20px; border-radius: 1px; background: {{accent}}"></span></sc-if></span>
<button aria-label="Menge erhöhen" style="position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: {{gp.bg}}; box-shadow: {{gp.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span aria-hidden="true" style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, {{gp.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span aria-hidden="true" style="position: absolute; left: 11px; right: 11px; bottom: 2px; height: 5px; border-radius: 50%; background: {{gp.glow}}; filter: blur(2px); pointer-events: none"></span><span style="position: relative; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; left: 7px; right: 7px; top: 2px; height: 15px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none"></span>
<svg style="filter: {{gp.iconShadow}}" style="position: relative" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{gp.icon}}" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</span></button>
</div>
<button aria-label="Maßeinheit: {{q.unit}}" style="flex-grow: 1; height: 52px; box-sizing: border-box; padding: 0 14px 0 16px; border-radius: 16px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 16px; font-weight: 500; color: {{k.text}}">{{q.unit}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{k.sub}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}; padding-left: 4px">Preis</span>
<div style="display: flex; gap: 10px">
<span style="width: 148px; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; gap: 8px">
<input type="text" inputmode="decimal" value="0,00" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; font-weight: 500; color: {{k.text}}">
<span style="font-size: 16px; font-weight: 600; color: {{k.sub}}">€</span>
</span>
<button style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; display: flex; align-items: center; gap: 10px; cursor: pointer; color: {{k.accentText}}; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 0"><span style="font-size: 15px; font-weight: 600">Preisverlauf</span><span style="font-size: 12px; color: {{k.sub}}">zuletzt 2,49 €</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{k.sub}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>

<sc-if value="{{amount}}" hint-placeholder-val="{{ false }}">
<!-- Leiste über dem Ziffernblock: Schnellwahl passend zur Einheit (Glas-Chips) + „Fertig“ -->
<div style="position: absolute; left: 0; right: 0; bottom: 291px; height: 50px; z-index: 2; box-sizing: border-box; padding: 0 12px; background: {{kb.bar}}; border-top: 1px solid {{kb.line}}; display: flex; align-items: center; gap: 8px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button style="position: relative; overflow: hidden; height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: {{p.bg}}; box-shadow: {{p.shadow}}; color: {{p.color}}; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap"><span aria-hidden="true" style="position: absolute; left: 10px; right: 10px; top: 2px; height: 13px; border-radius: 6px; background: linear-gradient(180deg, {{p.gloss}}, rgba(255,255,255,0)); filter: blur(1px); pointer-events: none"></span><span style="position: relative">{{p.label}}</span></button>
</sc-for>
<span style="margin-left: auto; font-size: 16px; font-weight: 600; color: {{k.accentText}}">Fertig</span>
</div>
<!-- iOS-Ziffernblock (nur ganze Zahlen) -->
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 291px; z-index: 2; box-sizing: border-box; padding: 6px 6px 0 6px; background: {{kb.bg}}; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 46px; gap: 7px">
<sc-for list="{{keys}}" as="key" hint-placeholder-count="12">
<span style="border-radius: 6px; background: {{key.bg}}; box-shadow: {{key.shadow}}; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 25px; line-height: 1; color: {{kb.text}}">{{key.n}}<span style="font-size: 9px; font-weight: 700; letter-spacing: 0.12em; margin-top: 1px">{{key.l}}</span></span>
</sc-for>
</div>
</sc-if>
<div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
<button style="position: relative; width: 100%; height: 56px; border-radius: 28px; border: 0; padding: 0; background: {{cta.bg}}; box-shadow: {{cta.shadow}}; color: {{cta.text}}; font-size: 16px; font-weight: 600; cursor: pointer; overflow: hidden">
<span aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 3px; height: 22px; border-radius: 11px; background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); filter: blur(1px); pointer-events: none"></span>
<span aria-hidden="true" style="position: absolute; left: 40px; right: 40px; bottom: 3px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.16); filter: blur(3px); pointer-events: none"></span>
<span style="position: relative">Speichern</span>
</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"mode":{"editor":"enum","default":"default","options":["default","amount"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)',
      dashed: rgba(accent, 0.45), chip: 'rgba(255,255,255,0.05)', stepOff: 'rgba(255,255,255,0.06)', stepOffIcon: 'rgba(255,255,255,0.3)', accentText: light
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      field: '#F4F7F7', fieldBorder: '#E6EDEE',
      dashed: rgba(accent, 0.45), chip: '#F4F7F7', stepOff: '#E8EEEF', stepOffIcon: '#A9B8BA', accentText: deep
    };
    const step = {
      bg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 50%, ' + deep + ' 100%)',
      shadow: 'inset 0 -2px 5px rgba(0,30,34,0.25), 0 6px 12px -6px ' + rgba(accent, dark ? 0.5 : 0.8)
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    const cats = [
      { label: 'Obst & Gemüse', icon: 'M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19l8-8' },
      { label: 'Milchprodukte', icon: 'M12 3.5s-6 6.6-6 10.5a6 6 0 0 0 12 0c0-3.9-6-10.5-6-10.5z' },
      { label: 'Backwaren', icon: 'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1.5-3 4-3 7h3' }
    ];
    // Glas-Knöpfe (Designsprache wie FAB): gp = Akzent, gn = neutral, gnd = neutral dunkel (Kamera/Bild), gd = Gefahr
    const gp = {
      bg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      pbg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 50%, ' + deep + ' 100%)',
      shadow: dark ? 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 14px -7px ' + rgba(accent, 0.55) : 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 16px -6px ' + rgba(accent, 0.7) + ', 0 0 18px ' + rgba(accent, 0.25),
      gloss: 'rgba(255,255,255,0.6)', glow: 'rgba(255,255,255,0.22)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(0,40,45,0.35))'
    };
    const gnDark = {
      bg: 'radial-gradient(circle at 32% 22%, #41575B 0%, #1F3033 50%, #111C1E 100%)',
      pbg: 'linear-gradient(180deg, #33474A 0%, #1F3033 55%, #152326 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 16px -8px rgba(0,0,0,0.8)',
      gloss: 'rgba(255,255,255,0.28)', glow: 'rgba(255,255,255,0.1)', icon: '#D3E6E8', iconShadow: 'none'
    };
    const gn = dark ? gnDark : {
      bg: 'radial-gradient(circle at 32% 22%, #FFFFFF 0%, #EEF4F5 50%, #D3DFE1 100%)',
      pbg: 'linear-gradient(180deg, #FFFFFF 0%, #EEF4F5 55%, #DCE6E8 100%)',
      shadow: 'inset 0 -3px 6px rgba(12,40,44,0.12), 0 1px 2px rgba(12,40,44,0.08), 0 8px 16px -8px rgba(12,40,44,0.35)',
      gloss: 'rgba(255,255,255,0.95)', glow: 'rgba(255,255,255,0.6)', icon: '#1E3A3E', iconShadow: 'none'
    };
    const gnd = gnDark;
    const gd = {
      bg: 'radial-gradient(circle at 32% 22%, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      pbg: 'linear-gradient(180deg, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4), 0 10px 20px -10px rgba(229,72,77,0.6)',
      gloss: 'rgba(255,255,255,0.5)', glow: 'rgba(255,255,255,0.2)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(80,0,0,0.3))'
    };
    const amount = (this.props.mode ?? 'default') === 'amount';
    const ring = amount ? (dark ? rgba(accent, 0.7) : rgba(accent, 0.75)) : '';
    const q = amount
      ? { shift: '-196px', headPad: '12px', headBg: dark ? '#0F1F21' : '#FFFFFF', value: '500', unit: 'Gramm', bg: dark ? 'rgba(255,255,255,0.06)' : '#FFFFFF', border: '1.5px solid ' + ring, ring: '0 0 0 4px ' + rgba(accent, 0.12) }
      : { shift: '0px', headPad: '0px', headBg: 'transparent', value: '1', unit: 'Packung', bg: k.field, border: '1px solid ' + k.fieldBorder, ring: 'none' };
    const presets = ['100 g', '250 g', '500 g', '1 kg'].map((label) => {
      const on = label === '500 g';
      const g = on ? gp : gn;
      return { label, bg: g.pbg, shadow: g.shadow, gloss: g.gloss, color: on ? '#FFFFFF' : k.accentText };
    });
    const kb = dark ? { bg: '#2B2F31', bar: '#1F2426', line: 'rgba(255,255,255,0.06)', key: '#5A5E61', fn: 'rgba(0,0,0,0)', text: '#FFFFFF' } : { bg: '#D1D4D9', bar: '#F4F6F7', line: 'rgba(0,0,0,0.08)', key: '#FFFFFF', fn: 'rgba(0,0,0,0)', text: '#0F2528' };
    const letters = ['', 'ABC', 'DEF', 'GHI', 'JKL', 'MNO', 'PQRS', 'TUV', 'WXYZ'];
    const keys = letters.map((l, i) => ({ n: String(i + 1), l, bg: kb.key, shadow: '0 1px 0 rgba(0,0,0,0.3)' }))
      .concat([{ n: '', l: '', bg: kb.fn, shadow: 'none' }, { n: '0', l: '', bg: kb.key, shadow: '0 1px 0 rgba(0,0,0,0.3)' }, { n: '⌫', l: '', bg: kb.fn, shadow: 'none' }]);
    return { gp, gn, gnd, gd, k, step, cta, cats, theme, accent, amount, q, presets, kb, keys };
  }
}
</script>
</body>
</html>
