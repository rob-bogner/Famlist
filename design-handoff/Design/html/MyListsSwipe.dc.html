<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meine Listen – Wisch-Aktionen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>

<section aria-label="Meine Listen" style="position: absolute; left: 0; top: 54px; width: 390px; height: 790px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden">
<div style="padding: 10px 20px 0 20px; display: flex; flex-direction: column; align-items: center">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Meine Listen</h1>
<button aria-label="Schließen" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: {{gn.bg}}; box-shadow: {{gn.shadow}}; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span aria-hidden="true" style="position: absolute; left: 8px; right: 8px; top: 3px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, {{gn.gloss}}, rgba(255,255,255,0)); pointer-events: none"></span><span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 3px; height: 6px; border-radius: 50%; background: {{gn.glow}}; filter: blur(2px); pointer-events: none"></span><span style="position: relative; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{gn.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</span></button>
</div>
</div>

<div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}; padding: 0 4px">{{count}}</span><button aria-label="My List, Favorit, 12 Artikel, ausgewählt" style="width: 100%; box-sizing: border-box; padding: 12.5px 12.5px 12.5px 12.5px; border-radius: 22px; background: {{k.card}}; border: 1.5px solid {{k.ring}}; box-shadow: 0 0 0 4px {{k.ringSoft}}, {{k.cardShadow}}; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; color: {{k.text}}">
<span style="width: 48px; height: 48px; border-radius: 16px; background: {{tileGrad}}; box-shadow: {{tileShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h11M9 12h11M9 17h11"></path><circle cx="5" cy="7" r="1"></circle><circle cx="5" cy="12" r="1"></circle><circle cx="5" cy="17" r="1"></circle></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="display: flex; align-items: center; gap: 6px">
<span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600; color: {{k.text}}">My List</span>
<svg aria-label="Favorit" width="16" height="16" viewBox="0 0 24 24" fill="#F5B521" stroke="#F5B521" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5z"></path></svg>
</span>
<span style="font-size: 13px; color: {{k.sub}}">12 Artikel</span>
</span>
<span style="width: 32px; height: 32px; border-radius: 50%; background: {{checkBg}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 14px -6px {{checkGlow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</button><sc-if value="{{notUndo}}" hint-placeholder-val="{{ true }}"><div style="position: relative; height: 76px"><sc-if value="{{left}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; right: 0; top: 0; height: 76px; display: flex; align-items: center; gap: 4px"><sc-for list="{{actions}}" as="a" hint-placeholder-count="4"><div style="width: 70px; display: flex; flex-direction: column; align-items: center; gap: 5px"><button aria-label="{{a.label}}" style="position: relative; width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; background: {{a.bg}}; box-shadow: {{a.shadow}}; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden"><span style="position: absolute; left: 8px; right: 8px; top: 3px; height: 17px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0)); pointer-events: none"></span><svg style="position: relative" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg></button><span style="font-size: 11px; font-weight: 600; color: {{k.sub}}; white-space: nowrap">{{a.label}}</span></div></sc-for></div></sc-if><sc-if value="{{right}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; top: 0; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center"><div style="width: 70px; display: flex; flex-direction: column; align-items: center; gap: 5px"><button aria-label="Favorit" style="position: relative; width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; background: {{fav.bg}}; box-shadow: {{fav.shadow}}; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden"><span style="position: absolute; left: 8px; right: 8px; top: 3px; height: 17px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0)); pointer-events: none"></span><svg style="position: relative" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5z"></path></svg></button><span style="font-size: 11px; font-weight: 600; color: {{k.sub}}; white-space: nowrap">Favorit</span></div></div></sc-if><div style="position: absolute; left: {{cardLeft}}; top: 0; width: 350px; box-sizing: border-box; padding: 12.5px; border-radius: 22px; background: {{k.card}}; border: 1px solid {{k.cardBorder}}; box-shadow: {{k.cardShadow}}; display: flex; align-items: center; gap: 14px; color: {{k.text}}"><span style="width: 48px; height: 48px; border-radius: 16px; background: {{tileGrad}}; box-shadow: {{tileShadow}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h11M9 12h11M9 17h11"></path><circle cx="5" cy="7" r="1"></circle><circle cx="5" cy="12" r="1"></circle><circle cx="5" cy="17" r="1"></circle></svg></span><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600">Drogerie</span><span style="font-size: 13px; color: {{k.sub}}">4 Artikel</span></span><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{k.cardBorder}}; flex-shrink: 0"></span></div></div></sc-if></div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
<button style="position: relative; width: 100%; height: 56px; border-radius: 28px; border: 0; padding: 0; background: {{cta.bg}}; box-shadow: {{cta.shadow}}; color: {{cta.text}}; font-size: 16px; font-weight: 600; cursor: pointer; overflow: hidden">
<span aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 3px; height: 22px; border-radius: 11px; background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); filter: blur(1px); pointer-events: none"></span>
<span aria-hidden="true" style="position: absolute; left: 40px; right: 40px; bottom: 3px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.16); filter: blur(3px); pointer-events: none"></span>
<span style="position: relative">Neue Liste erstellen</span>
</button>
</div>
</section>
<sc-if value="{{undo}}" hint-placeholder-val="{{ false }}"><div role="status" aria-live="polite" style="position: absolute; left: 20px; right: 20px; bottom: 104px; height: 56px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 20px; background: {{toast.bg}}; border: 1px solid {{toast.border}}; box-shadow: {{toast.shadow}}; display: flex; align-items: center; gap: 12px; overflow: hidden"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 11.2a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7M10 11v5M14 11v5"></path></svg><span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">„Drogerie“ gelöscht</span><button style="height: 40px; padding: 0 14px; border: 0; border-radius: 14px; background: {{toast.undoBg}}; color: {{toast.undo}}; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{toast.undo}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>Rückgängig</button><div style="position: absolute; left: 0; bottom: 0; height: 3px; width: 62%; background: {{toast.timer}}"></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"mode":{"editor":"enum","default":"left","options":["left","right","undo"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      card: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03))', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px -14px rgba(0,0,0,0.7)',
      ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.12), cardBorder: 'rgba(255,255,255,0.08)'
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      card: '#FFFFFF', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 10px 22px -14px rgba(12,40,44,0.22)',
      ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12), cardBorder: '#EDF2F2'
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    // Glas-Knöpfe (Designsprache wie FAB): gp = Akzent, gn = neutral, gnd = neutral dunkel (Kamera/Bild), gd = Gefahr
    const gp = {
      bg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      pbg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 50%, ' + deep + ' 100%)',
      shadow: dark ? 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 14px -7px ' + rgba(accent, 0.55) : 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 16px -6px ' + rgba(accent, 0.7) + ', 0 0 18px ' + rgba(accent, 0.25),
      gloss: 'rgba(255,255,255,0.6)', glow: 'rgba(255,255,255,0.22)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(0,40,45,0.35))'
    };
    const gnDark = {
      bg: 'radial-gradient(circle at 32% 22%, #41575B 0%, #1F3033 50%, #111C1E 100%)',
      pbg: 'linear-gradient(180deg, #33474A 0%, #1F3033 55%, #152326 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 16px -8px rgba(0,0,0,0.8)',
      gloss: 'rgba(255,255,255,0.28)', glow: 'rgba(255,255,255,0.1)', icon: '#D3E6E8', iconShadow: 'none'
    };
    const gn = dark ? gnDark : {
      bg: 'radial-gradient(circle at 32% 22%, #FFFFFF 0%, #EEF4F5 50%, #D3DFE1 100%)',
      pbg: 'linear-gradient(180deg, #FFFFFF 0%, #EEF4F5 55%, #DCE6E8 100%)',
      shadow: 'inset 0 -3px 6px rgba(12,40,44,0.12), 0 1px 2px rgba(12,40,44,0.08), 0 8px 16px -8px rgba(12,40,44,0.35)',
      gloss: 'rgba(255,255,255,0.95)', glow: 'rgba(255,255,255,0.6)', icon: '#1E3A3E', iconShadow: 'none'
    };
    const gnd = gnDark;
    const gd = {
      bg: 'radial-gradient(circle at 32% 22%, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      pbg: 'linear-gradient(180deg, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4), 0 10px 20px -10px rgba(229,72,77,0.6)',
      gloss: 'rgba(255,255,255,0.5)', glow: 'rgba(255,255,255,0.2)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(80,0,0,0.3))'
    };
    const mode = this.props.mode ?? 'left';
    const orb = (c1, c2, c3, glow) => ({ bg: 'radial-gradient(circle at 32% 22%, ' + c1 + ' 0%, ' + c2 + ' 55%, ' + c3 + ' 100%)',
      shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -3px 8px rgba(0,0,0,0.18), 0 10px 20px -8px ' + glow });
    const T = 'M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 11.2a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7';
    const actions = [
      Object.assign({ label: 'Löschen', icon: T }, orb('#FF8A80', '#E5484D', '#B4232A', 'rgba(229,72,77,0.6)')),
      Object.assign({ label: 'Umbenennen', icon: 'M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.5 6.5l4 4' }, orb('#8DB8FF', '#3B7BF6', '#1F4FC0', 'rgba(59,123,246,0.6)')),
      Object.assign({ label: 'Duplizieren', icon: 'M10 8h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2' }, orb('#7FE3D9', '#14B8A6', '#0F766E', 'rgba(20,184,166,0.6)')),
      Object.assign({ label: 'Mitglieder', icon: 'M12.5 8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0zM2.5 19c1-3 3.5-4.5 6.5-4.5s5.5 1.5 6.5 4.5M19.5 9a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM16 14.6c2.6.2 4.6 1.6 5.5 4.4' }, orb('#C9B8FF', '#8B6CFF', '#5B3FD6', 'rgba(139,108,255,0.6)'))
    ];
    const fav = Object.assign({ label: 'Favorit' }, orb('#FFE38A', '#F5B521', '#C98A06', 'rgba(201,138,6,0.7)'));
    const toast = dark
      ? { bg: 'rgba(30,48,52,0.95)', border: 'rgba(255,255,255,0.12)', shadow: 'inset 0 1px 0 rgba(255,255,255,0.1), 0 16px 32px -14px rgba(0,0,0,0.8)', undo: light, undoBg: rgba(accent, 0.16), timer: rgba(accent, 0.8) }
      : { bg: 'rgba(15,27,29,0.94)', border: 'rgba(255,255,255,0.1)', shadow: 'inset 0 1px 0 rgba(255,255,255,0.12), 0 16px 32px -14px rgba(12,30,33,0.5)', undo: light, undoBg: rgba(accent, 0.18), timer: rgba(accent, 0.9) };
    const noLists = false;
    return { actions, fav, toast, left: mode === 'left', right: mode === 'right', undo: mode === 'undo', notUndo: mode !== 'undo',
      cardLeft: mode === 'left' ? '-300px' : (mode === 'right' ? '86px' : '0px'),
      count: mode === 'undo' ? '1 Liste' : '2 Listen',
      gp, gn, gnd, gd, hasLists: !noLists, noLists,
      k, cta, theme, accent,
      tileGrad: 'linear-gradient(150deg, ' + light + ', ' + deep + ')',
      tileShadow: 'inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 14px -4px ' + rgba(accent, 0.6),
      checkBg: 'radial-gradient(circle at 32% 22%, ' + light + ' 0%, ' + accent + ' 45%, ' + deep + ' 100%)',
      checkGlow: rgba(accent, 0.6)
    };
  }
}
</script>
</body>
</html>
