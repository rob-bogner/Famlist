      tile: 'linear-gradient(150deg, ' + rgba(accent, 0.24) + ', ' + rgba(accent, 0.06) + ')', dashed: rgba(accent, 0.45), ok: '#4FD1A1', chip: rgba(accent, 0.16), ringBase: '#132426', appleBg: '#FFFFFF', appleText: '#000000', warn: '#F2B24C', warnBorder: 'rgba(242,178,76,0.5)', okSoft: 'rgba(79,209,161,0.14)', dotFill: '#0A1416', areaFill: rgba(accent, 0.16)

      line: '#EDF1F2', accentText: deep, danger: '#C8363B', dangerSoft: 'rgba(200,54,59,0.08)',
      toggleOn: 'linear-gradient(180deg, ' + accent + ', ' + deep + ')', toggleOff: '#DCE5E6',
      segBg: '#F1F5F5', segOn: '#FFFFFF', segOnText: '#0F2528',
      menu: 'rgba(255,255,255,0.97)', menuBorder: 'rgba(15,37,40,0.08)', menuShadow: '0 24px 48px -16px rgba(12,40,44,0.35)',

    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    const heroBg = 'linear-gradient(150deg, ' + light + ' 0%, ' + accent + ' 42%, ' + (dark ? mix(accent, 0, 0.6) : deep) + ' 100%)';
    // Glas-Knöpfe (Designsprache wie FAB): gp = Akzent, gn = neutral, gnd = neutral dunkel (Kamera/Bild), gd = Gefahr
    const gp = {

      shadow: dark ? 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 14px -7px ' + rgba(accent, 0.55) : 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 16px -6px ' + rgba(accent, 0.7) + ', 0 0 18px ' + rgba(accent, 0.25),
      gloss: 'rgba(255,255,255,0.6)', glow: 'rgba(255,255,255,0.22)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(0,40,45,0.35))'
    };
    const gnDark = {

      gloss: 'rgba(255,255,255,0.28)', glow: 'rgba(255,255,255,0.1)', icon: '#D3E6E8', iconShadow: 'none'
    };
    const gn = dark ? gnDark : {
      bg: 'radial-gradient(circle at 32% 22%, #FFFFFF 0%, #EEF4F5 50%, #D3DFE1 100%)',
      pbg: 'linear-gradient(180deg, #FFFFFF 0%, #EEF4F5 55%, #DCE6E8 100%)',
      shadow: 'inset 0 -3px 6px rgba(12,40,44,0.12), 0 1px 2px rgba(12,40,44,0.08), 0 8px 16px -8px rgba(12,40,44,0.35)',
      gloss: 'rgba(255,255,255,0.95)', glow: 'rgba(255,255,255,0.6)', icon: '#1E3A3E', iconShadow: 'none'
    };
    const gnd = gnDark;
    const gd = {
      bg: 'radial-gradient(circle at 32% 22%, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      pbg: 'linear-gradient(180deg, #FF8A80 0%, #E5484D 55%, #B4232A 100%)',
      shadow: 'inset 0 -3px 6px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4), 0 10px 20px -10px rgba(229,72,77,0.6)',
      gloss: 'rgba(255,255,255,0.5)', glow: 'rgba(255,255,255,0.2)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(80,0,0,0.3))'
    };
    const c = dark
      ? { obst: '#5BC98A', milch: '#7AA6F5', fleisch: '#F07C78', back: '#F0B654', getr: '#A58CF5', suess: '#F08DB9', konserv: '#E8A07A', sonst: '#6F8588', kh: '#F0B654', fett: '#F07C78', eiw: '#7AA6F5' }
      : { obst: '#3FA66B', milch: '#4F86E8', fleisch: '#D9534F', back: '#D99A2B', getr: '#8466E8', suess: '#E0679E', konserv: '#D07A4A', sonst: '#93A5A8', kh: '#D99A2B', fett: '#D9534F', eiw: '#4F86E8' };
    const cs = {};
    for (const key of Object.keys(c)) cs[key] = rgba(c[key], dark ? 0.18 : 0.12);
    return { c, cs, gp, gn, gnd, gd, k, cta, theme, accent, heroBg, avatarBg: 'linear-gradient(150deg, ' + light + ', ' + deep + ')' };
  }
