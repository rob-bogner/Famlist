class Component extends DCLogic {
  constructor(props) {

  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); }

    return bz(t, 0, 1);
  }
  loop(t) {

    }
    this.setState({ p, phase });
    if (phase === 'holding' || phase === 'closing') this.raf = requestAnimationFrame(this.loop); else this.raf = 0;
  }
  hit(e) {

    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };

      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0)',
      card: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03))', cardBorder: 'rgba(255,255,255,0.08)', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px -14px rgba(0,0,0,0.7)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)', fieldFocus: 'rgba(255,255,255,0.06)', ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.12),
      line: 'rgba(255,255,255,0.08)', accentText: light, danger: '#FF7A7E', dangerSoft: 'rgba(255,122,126,0.12)',

      segBg: 'rgba(255,255,255,0.06)', segOn: 'rgba(255,255,255,0.14)', segOnText: '#FFFFFF',
      menu: 'rgba(20,34,37,0.97)', menuBorder: 'rgba(255,255,255,0.1)', menuShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 24px 48px -16px rgba(0,0,0,0.8)',
      tile: 'linear-gradient(150deg, ' + rgba(accent, 0.24) + ', ' + rgba(accent, 0.06) + ')', dashed: rgba(accent, 0.45), appleBg: '#FFFFFF', appleText: '#000000', ok: '#4FD1A1', chip: rgba(accent, 0.16), ringBase: '#132426', warn: '#F2B24C', warnBorder: 'rgba(242,178,76,0.5)', okSoft: 'rgba(79,209,161,0.14)', dotFill: '#0A1416', areaFill: rgba(accent, 0.16)

      menu: 'rgba(255,255,255,0.97)', menuBorder: 'rgba(15,37,40,0.08)', menuShadow: '0 24px 48px -16px rgba(12,40,44,0.35)',

    const gp = {

      pbg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 50%, ' + deep + ' 100%)',
      shadow: dark ? 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 14px -7px ' + rgba(accent, 0.55) : 'inset 0 -3px 6px rgba(0,30,34,0.3), 0 8px 16px -6px ' + rgba(accent, 0.7) + ', 0 0 18px ' + rgba(accent, 0.25),
      gloss: 'rgba(255,255,255,0.6)', glow: 'rgba(255,255,255,0.22)', icon: '#FFFFFF', iconShadow: 'drop-shadow(0 1px 2px rgba(0,40,45,0.35))'

    const gnDark = {

    // Mengen-Ausrollen
    const st = this.state;
    const interacted = st.p !== null;
    const p = interacted ? st.p : Number(this.props.roll ?? 0);
    const hov = interacted ? st.hover : (Number(this.props.hover ?? 0) || null);
    const qty = st.qty ?? Number(this.props.qty ?? 1);
    const W = 266;                                            // Knopf-Breite bei 390 pt
    const front = W * p;
    const th = 18 - 12 * p;
    const rollO = Math.max(0, Math.min(1, p * 12)) * Math.max(0, Math.min(1, (1 - p) * 8));
    const pills = [2, 3, 4, 5, 6].map((v) => {
      const on = hov === v;
      return { v, label: v + '×', aria: 'Menge ' + v,
        style: 'background: linear-gradient(180deg, ' + rgba(accent, on ? 0.75 : 0.55) + ', ' + rgba(accent, on ? 0.35 : 0.22) + '); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2), 0 0 16px ' + rgba(accent, on ? 0.45 : 0.3) + ';' + (on ? ' transform: scale(1.04);' : ''),
        pick: () => this.pick(v) };
    });
    const image = this.props.image !== false && this.props.image !== 'false';
    return { found: mode === 'found', cam: mode === 'noCamera' ? 'Kamera nicht verfügbar' : 'Kamerabild',
      hint: mode === 'lookup' ? 'Artikel wird gesucht …' : 'Barcode in den Rahmen halten', 
      hasImage: image, noImage: !image, imgBg: image ? '#FFFFFF' : k.tile, imgRing: image && dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0)',
      chips: ['250 g', 'Milchprodukte'], chipBg: rgba(accent, dark ? 0.18 : 0.1),
      qtyText: qty + '×', pills, locked: st.phase === 'locked',
      circStyle: 'box-shadow: ' + gn.shadow + ', 0 0 ' + (28 * p).toFixed(1) + 'px ' + rgba(accent, (0.5 * p).toFixed(3)) + '; transform: scale(' + (this.pressing ? 0.93 : 1) + '); transition: transform 0.15s;',
      numStyle: 'opacity: ' + (1 - p).toFixed(3) + '; transform: scale(' + (1 - 0.4 * p).toFixed(3) + ');',
      xStyle: 'opacity: ' + p.toFixed(3) + '; transform: rotate(' + (-90 * (1 - p)).toFixed(1) + 'deg);',
      ctaClip: 'clip-path: inset(0 0 0 ' + front.toFixed(1) + 'px); pointer-events: ' + (p < 0.05 ? 'auto' : 'none') + ';',
      surfClip: 'clip-path: inset(0 ' + (W - front).toFixed(1) + 'px 0 0);',
      surfPE: p > 0.6 ? 'auto' : 'none',
      rollStyle: 'left: ' + (front - th / 2).toFixed(1) + 'px; width: ' + th.toFixed(1) + 'px; opacity: ' + rollO.toFixed(3) + '; background: linear-gradient(90deg, rgba(0,0,0,0.45) 0%, ' + accent + ' 30%, rgba(255,255,255,0.85) 50%, ' + accent + ' 72%, rgba(0,0,0,0.5) 100%); box-shadow: -4px 0 10px rgba(0,0,0,0.45);',
      down: (e) => {
        e.preventDefault();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        this.pressing = true;
        if (this.state.phase === 'locked') { this.tapClose = true; this.setState({}); return; }
        this.tapClose = false;
        this.down = true; this.t0 = performance.now(); this.moved = false; this.x0 = e.clientX; this.y0 = e.clientY;
        this.setState({ phase: 'holding', p: this.state.p ?? 0, hover: null });
        this.start();
      },
      move: (e) => {
        if (!this.down) return;
        if (Math.hypot(e.clientX - this.x0, e.clientY - this.y0) > 10) this.moved = true;
        const held = performance.now() - this.t0 > 200 || this.state.phase === 'locked';
        const h = held ? this.hit(e) : null;
        if (h !== this.state.hover) { if (h && navigator.vibrate) { try { navigator.vibrate(6); } catch (err) {} } this.setState({ hover: h }); }
      },
      up: (e) => {
        this.pressing = false;
        if (this.tapClose) { this.tapClose = false; this.close(); return; }
        if (!this.down) { this.setState({}); return; }
        this.down = false;
        const el = performance.now() - this.t0;
        const h = this.state.hover;
        if (h) { this.pick(h); return; }
        if (el < 100 && !this.moved) { this.setState({ qty: qty >= 9 ? 1 : qty + 1 }); this.close(); return; }
        if (this.state.phase === 'holding') this.close(); else this.setState({ hover: null });
      },
      tapScrim: () => { if (this.state.phase === 'locked') this.close(); },
gp, gn, gnd, gd, k, cta, theme, accent, bg, heroBg, avatarBg: 'linear-gradient(150deg, ' + light + ', ' + deep + ')' };
  }
}
</script>
</body>
</html>
