<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mitglieder &amp; Teilen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="Hybrid" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>

<section aria-label="Mitglieder und Teilen" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 708px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden; padding: 10px 20px 34px 20px; display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Mitglieder &amp; Teilen</h1>
<button aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{k.close}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<!-- Mitglieder -->
<span style="margin-top: 20px; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}">Mitglieder · 1</span>
<div style="margin-top: 10px; padding: 13px 14px; border-radius: 22px; background: {{k.card}}; border: 1px solid {{k.cardBorder}}; box-shadow: {{k.cardShadow}}; display: flex; align-items: center; gap: 14px">
<span style="width: 44px; height: 44px; border-radius: 50%; background: {{avatarBg}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45); display: flex; align-items: center; justify-content: center; color: #ffffff; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; flex-shrink: 0">R</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600">Rob (Du)</span>
<span style="font-size: 13px; color: {{k.sub}}">Besitzer</span>
</span>
</div>
<div style="margin-top: 10px; padding: 12px 14px; border-radius: 18px; border: 1.5px dashed {{k.dashed}}; display: flex; align-items: center; gap: 12px; color: {{k.sub}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0zM2.5 19c1-3 3.5-4.5 6.5-4.5 1.6 0 3 .4 4.2 1.2M18 14v6M15 17h6"></path></svg>
<span style="font-size: 14px; line-height: 1.4">Noch niemand eingeladen. Teile den Link, um Familie oder Freunde dazuzuholen.</span>
</div>

<!-- Einladen -->
<span style="margin-top: 24px; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}">Einladen</span>
<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px">
<button style="position: relative; width: 100%; height: 56px; border-radius: 28px; border: 0; padding: 0; background: {{cta.bg}}; box-shadow: {{cta.shadow}}; color: {{cta.text}}; font-size: 16px; font-weight: 600; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px">
<span style="position: absolute; left: 24px; right: 24px; top: 2px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0)); pointer-events: none"></span>
<svg style="position: relative" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{cta.text}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
<span style="position: relative">Einladungslink teilen</span>
</button>
<button style="width: 100%; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; color: {{k.accentText}}; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
Link kopieren
</button>
<span style="padding: 0 8px; font-size: 13px; color: {{k.sub}}; text-align: center">Der Link funktioniert nur mit installierter Famlist-App.</span>
</div>

<!-- Öffentliche ID -->
<div style="margin-top: 22px; height: 1px; background: {{k.line}}"></div>
<div style="margin-top: 18px; display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
<span style="font-size: 13px; font-weight: 600; color: {{k.sub}}">Deine öffentliche ID</span>
<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 15px; color: {{k.text}}">test_public_id</span>
<span style="font-size: 12px; color: {{k.sub}}; line-height: 1.35">Andere können dich damit finden und einladen.</span>
</span>
<button aria-label="ID kopieren" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{k.fieldBorder}}; background: {{k.field}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      card: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03))', cardBorder: 'rgba(255,255,255,0.08)', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px -14px rgba(0,0,0,0.7)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)', dashed: rgba(accent, 0.4), line: 'rgba(255,255,255,0.08)', accentText: light
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      card: '#FFFFFF', cardBorder: '#EDF2F2', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 10px 22px -14px rgba(12,40,44,0.22)',
      field: '#F4F7F7', fieldBorder: '#E6EDEE', dashed: rgba(accent, 0.4), line: '#EDF1F2', accentText: deep
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    return { k, cta, theme, accent, avatarBg: 'linear-gradient(150deg, ' + light + ', ' + deep + ')' };
  }
}
</script>
</body>
</html>
