<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Preisverlauf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button,input{font-family:inherit}
input::placeholder{color:inherit;opacity:0.75}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: {{k.text}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<dc-import name="EditItem" theme="{{theme}}" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{k.scrim}}; backdrop-filter: blur(3px)"></div>
<section aria-label="Preisverlauf" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 754px; box-sizing: border-box; border-radius: 34px 34px 0 0; background: {{k.sheet}}; border-top: 1px solid {{k.sheetBorder}}; box-shadow: {{k.sheetShadow}}; overflow: hidden; padding: 10px 20px 24px 20px; display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{k.grabber}}"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Preisverlauf</h1>
<button aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: {{k.close}}; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{k.icon}}" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<div style="margin-top: 16px; display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: {{k.tile}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{k.accentText}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2 11h10.5l2-8H7"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600">Kerrygold Butter</span><span style="font-size: 13px; color: {{k.sub}}">250 g · zuletzt 2,49 € bei Edeka</span></span>
</div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><div style="padding: 10px 12px; border-radius: 16px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: {{k.sub}}">Tiefster</span><span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600">2,19 €</span></div><div style="padding: 10px 12px; border-radius: 16px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: {{k.sub}}">Schnitt</span><span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600">2,39 €</span></div><div style="padding: 10px 12px; border-radius: 16px; background: {{k.field}}; border: 1px solid {{k.fieldBorder}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: {{k.sub}}">Höchster</span><span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600">2,59 €</span></div></div>
<div style="margin-top: 16px; padding: 16px 16px 10px 16px; border-radius: 22px; background: {{k.card}}; border: 1px solid {{k.cardBorder}}; box-shadow: {{k.cardShadow}}">
<svg width="100%" height="160" viewBox="-6 -6 330 162" preserveAspectRatio="none" role="img" aria-label="Preisverlauf der letzten 7 Monate">
<path d="M0 75.0 H318" stroke="{{k.line}}" stroke-width="1" stroke-dasharray="4 4"></path>
<path d="M0.0 114.4 L53.0 95.6 L106.0 95.6 L159.0 58.1 L212.0 76.9 L265.0 39.4 L318.0 58.1 L318 150 L0 150 Z" fill="{{k.areaFill}}" stroke="none"></path>
<path d="M0.0 114.4 L53.0 95.6 L106.0 95.6 L159.0 58.1 L212.0 76.9 L265.0 39.4 L318.0 58.1" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="0.0" cy="114.4" r="3.5" fill="{{k.dotFill}}" stroke="{{accent}}" stroke-width="2"></circle><circle cx="53.0" cy="95.6" r="3.5" fill="{{k.dotFill}}" stroke="{{accent}}" stroke-width="2"></circle><circle cx="106.0" cy="95.6" r="3.5" fill="{{k.dotFill}}" stroke="{{accent}}" stroke-width="2"></circle><circle cx="159.0" cy="58.1" r="3.5" fill="{{k.dotFill}}" stroke="{{accent}}" stroke-width="2"></circle><circle cx="212.0" cy="76.9" r="3.5" fill="{{k.dotFill}}" stroke="{{accent}}" stroke-width="2"></circle><circle cx="265.0" cy="39.4" r="3.5" fill="{{k.dotFill}}" stroke="{{accent}}" stroke-width="2"></circle><circle cx="318.0" cy="58.1" r="5" fill="{{accent}}" stroke="{{accent}}" stroke-width="2"></circle>
</svg>
<div style="margin-top: 6px; display: flex; justify-content: space-between; font-size: 11px; color: {{k.sub}}"><span>Mär</span><span>Apr</span><span>Mai</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span></div>
</div>
<span style="margin-top: 18px; padding: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{k.sub}}">Nach Laden</span>
<div style="margin-top: 10px; border-radius: 20px; background: {{k.card}}; border: 1px solid {{k.cardBorder}}; overflow: hidden"><div style="min-height: 56px; box-sizing: border-box; padding: 8px 14px;  display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Edeka</span><span style="font-size: 12px; color: {{k.sub}}">zuletzt im September</span></span><span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600">2,49 €</span></div><div style="min-height: 56px; box-sizing: border-box; padding: 8px 14px; border-top: 1px solid {{k.line}}; display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Lidl</span><span style="font-size: 12px; color: {{k.sub}}">zuletzt im März</span></span><span style="padding: 3px 8px; border-radius: 999px; background: {{k.okSoft}}; color: {{k.ok}}; font-size: 11px; font-weight: 700">GÜNSTIGSTER</span><span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600">2,19 €</span></div></div>
<span style="margin-top: 10px; font-size: 12px; color: {{k.sub}}; text-align: center">Beispielwerte · echte Preise kommen aus gescannten Kassenzetteln</span>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0FA3AE","options":["#0FA3AE","#2E7DF6","#7C5CFF","#F07A3C"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0FA3AE';
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const hex = (h) => { const s = h.replace('#', ''); const f = s.length === 3 ? s.split('').map((c) => c + c).join('') : s; return [0, 2, 4].map((i) => parseInt(f.slice(i, i + 2), 16)); };
    const mix = (h, target, amt) => { const a = hex(h); return 'rgb(' + a.map((v) => Math.round(v + (target - v) * amt)).join(',') + ')'; };
    const rgba = (h, al) => 'rgba(' + hex(h).join(',') + ',' + al + ')';
    const light = mix(accent, 255, 0.32);
    const deep = mix(accent, 0, dark ? 0.5 : 0.4);
    const k = dark ? {
      sheet: 'linear-gradient(180deg, #102022 0%, #0A1416 100%)', sheetBorder: 'rgba(255,255,255,0.08)', sheetShadow: '0 -24px 50px -20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06)',
      text: '#EAF5F6', sub: '#93ADB1', close: 'rgba(255,255,255,0.08)', icon: '#D3E6E8', grabber: 'rgba(255,255,255,0.18)', scrim: 'rgba(0,0,0,0.6)',
      card: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03))', cardBorder: 'rgba(255,255,255,0.08)', cardShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px -14px rgba(0,0,0,0.7)',
      field: 'rgba(255,255,255,0.05)', fieldBorder: 'rgba(255,255,255,0.09)', fieldFocus: 'rgba(255,255,255,0.06)', ring: rgba(accent, 0.7), ringSoft: rgba(accent, 0.12),
      line: 'rgba(255,255,255,0.08)', accentText: light, danger: '#FF7A7E', dangerSoft: 'rgba(255,122,126,0.12)',
      toggleOn: 'linear-gradient(180deg, ' + light + ', ' + accent + ')', toggleOff: 'rgba(255,255,255,0.14)',
      segBg: 'rgba(255,255,255,0.06)', segOn: 'rgba(255,255,255,0.14)', segOnText: '#FFFFFF',
      menu: 'rgba(20,34,37,0.97)', menuBorder: 'rgba(255,255,255,0.1)', menuShadow: 'inset 0 1px 0 rgba(255,255,255,0.08), 0 24px 48px -16px rgba(0,0,0,0.8)',
      tile: 'linear-gradient(150deg, ' + rgba(accent, 0.24) + ', ' + rgba(accent, 0.06) + ')', dashed: rgba(accent, 0.45), ok: '#4FD1A1', chip: rgba(accent, 0.16), ringBase: '#132426', appleBg: '#FFFFFF', appleText: '#000000', warn: '#F2B24C', warnBorder: 'rgba(242,178,76,0.5)', okSoft: 'rgba(79,209,161,0.14)', dotFill: '#0A1416', areaFill: rgba(accent, 0.16)
    } : {
      sheet: '#FFFFFF', sheetBorder: 'rgba(255,255,255,0)', sheetShadow: '0 -20px 40px -20px rgba(8,30,33,0.35)',
      text: '#0F2528', sub: '#5F7579', close: '#F1F5F5', icon: '#1E3A3E', grabber: '#D5DEDF', scrim: 'rgba(8,24,27,0.42)',
      card: '#FFFFFF', cardBorder: '#EDF2F2', cardShadow: '0 1px 2px rgba(12,40,44,0.05), 0 10px 22px -14px rgba(12,40,44,0.22)',
      field: '#F4F7F7', fieldBorder: '#E6EDEE', fieldFocus: '#FFFFFF', ring: rgba(accent, 0.75), ringSoft: rgba(accent, 0.12),
      line: '#EDF1F2', accentText: deep, danger: '#C8363B', dangerSoft: 'rgba(200,54,59,0.08)',
      toggleOn: 'linear-gradient(180deg, ' + accent + ', ' + deep + ')', toggleOff: '#DCE5E6',
      segBg: '#F1F5F5', segOn: '#FFFFFF', segOnText: '#0F2528',
      menu: 'rgba(255,255,255,0.97)', menuBorder: 'rgba(15,37,40,0.08)', menuShadow: '0 24px 48px -16px rgba(12,40,44,0.35)',
      tile: 'linear-gradient(150deg, #F4F8F8, #E2ECED)', dashed: rgba(accent, 0.45), ok: '#1F8A5B', chip: rgba(accent, 0.1), ringBase: '#FFFFFF', appleBg: '#000000', appleText: '#FFFFFF', warn: '#B7791F', warnBorder: 'rgba(183,121,31,0.45)', okSoft: 'rgba(31,138,91,0.1)', dotFill: '#FFFFFF', areaFill: rgba(accent, 0.12)
    };
    const cta = dark
      ? { bg: 'linear-gradient(180deg, ' + light + ' 0%, ' + accent + ' 100%)', text: '#04262A', shadow: 'inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 20px -12px ' + rgba(accent, 0.6) }
      : { bg: 'linear-gradient(180deg, ' + accent + ' 0%, ' + deep + ' 100%)', text: '#FFFFFF', shadow: 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 6px rgba(0,30,34,0.2), 0 14px 26px -12px ' + rgba(accent, 0.8) };
    const heroBg = 'linear-gradient(150deg, ' + light + ' 0%, ' + accent + ' 42%, ' + (dark ? mix(accent, 0, 0.6) : deep) + ' 100%)';
    return { k, cta, theme, accent, heroBg, avatarBg: 'linear-gradient(150deg, ' + light + ', ' + deep + ')' };
  }
}
</script>
</body>
</html>
