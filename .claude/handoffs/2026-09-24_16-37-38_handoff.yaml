decisions:
  - decision: |
      Listen-Aktionen per Wischgeste UND Kontextmenü.
    rationale: |
      Roberts Antwort („Beides“). Links-Durchwischen löst nichts aus; Löschen nur für den Besitzer, mit Rückfrage.
  - decision: |
      SwipeableListCard hat eigene Wisch-Logik (Kopie aus SwipeableItemRow), kein gemeinsamer Helfer.
    rationale: |
      Die Wischwerte der Artikel sind auf dem Gerät eingestellt; ein Umbau ist riskant. Als Refactor-Kandidat vorgemerkt.
  - decision: |
      Neue Listen gehören session.currentProfile.id (Fallback defaultList.ownerId).
    rationale: |
      Die alte Übersicht nahm defaultList.ownerId; das ist falsch, wenn die Standard-Liste geteilt ist.
      fetchAllLists ignoriert die ownerId (RLS), deshalb ändert sich beim Laden nichts.
  - decision: |
      „Theme“ = Design-System-Doku als Artifact (Typ Design System), Komponenten als statische HTML-Nachbauten.
    rationale: |
      Robert hat es gewählt; SwiftUI ist im Browser nicht lauffähig. Kontrastlücken der Quelle bleiben exakt und sind markiert.
