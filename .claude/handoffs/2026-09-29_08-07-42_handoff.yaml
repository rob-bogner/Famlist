  - decision: |
      Keine DB-Regel started_at < ended_at; Plausibilität (≤ 4 h, Beginn vor Ende) nur in der App.
    rationale: |
      Ein abgelehnter Insert bliebe in der Offline-Warteschlange hängen.
  - decision: |
      Alte Bons: fehlende Kategorie nur in der geöffneten Liste nachschlagen, nicht im Artikelstamm.
    rationale: |
      Artikelstamm nur asynchron; betroffen sind nur Bons vom 28.09. (zwischen Migration 029 und 030).
  - decision: |
      Auswertung ohne darunterliegendes Sheet, ✕ führt ins Archiv.
