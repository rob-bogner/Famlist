decisions:
  - decision: |
      Archivzustand in private.account_archive statt in profiles.
    rationale: |
      profiles_update erlaubt jedem die eigene Zeile; Frist wäre sonst selbst verschiebbar; Build 1 bleibt kompatibel.
  - decision: |
      „Sofort verschwinden“ über Kopieren und Löschen der list_members-Zeilen (private.archived_memberships).
    rationale: |
      Alle RLS-Regeln laufen über Mitgliedschaft; Trigger trg_list_member_removed meldet member_removed an Apps.
  - decision: |
      Fotos nur per Edge Function (Storage-API) löschen; pg_net aktiviert, Cron ruft account-purge mit Anon-Key.
    rationale: |
      storage.protect_delete blockiert SQL-DELETE; account-purge löscht nur Fälliges, braucht daher kein Geheimnis.
  - decision: |
      Archiv-Prüfung beim Start: ohne lokale Profilkopie vorher, mit Kopie im Hintergrund.
    rationale: |
      Offline-First: Kaltstart ohne Netz darf nicht auf ein Timeout warten.
  - decision: |
      design-handoff/ (SPEC, PLAN, MyListUI) nicht angefasst und nicht committet.
    rationale: |
      Die Claude-Design-Sitzung gleicht den Ordner laufend mit dem Canvas ab (Design/SYNC.md).
  - decision: |
      Build-Nummer per Skript statt manageAppVersionAndBuildNumber; Version (1.0) nur manuell per Argument.
    rationale: |
      Nummer im Repo = Nummer in TestFlight; App, Uhr und Widgets brauchen dieselbe Build-Nummer.
