decisions:
  - decision: |
      Vision-Dokumenterkennung ist im Simulator abgeschaltet (#if targetEnvironment(simulator) → nil).
    rationale: |
      Im Simulator liefert das Modell bei jedem Bild denselben falschen Streifen (Sicherheit bis 0,97), mit CGImage und
      CIImage. Auf dem Mac (swift-Skript) korrekt: Bon 0,99, leeres Bild Sicherheit 0. Die 3 Vision-Tests überspringen sich im Simulator.
  - decision: |
      Positionen als jsonb-Spalte receipts.lines statt eigener Tabelle; price_points.receipt_id ohne Fremdschlüssel.
    rationale: |
      Ein Bon wird einmal angelegt und nie geändert, die Zeilen erben die RLS des Bons. Preise werden vor dem Bon
      gesendet (Bon erst nach Foto-Upload); ein FK ließe die Preise scheitern.
  - decision: |
      Preise bekommen receiptId nur, wenn „Fotos der Bons speichern“ an ist und eine Liste bekannt ist.
    rationale: |
      Ohne Archiv-Eintrag gibt es keinen Bon, auf den verwiesen werden kann.
  - decision: |
      Icon für „Gespeicherte Kassenzettel“ im Menü: EKKIcon.gallery.
    rationale: |
      Kein Kassenzettel-Icon existiert in den Designs; Regel erlaubt nur Original-SVG-Pfade. Robert kann es austauschen.
  - decision: |
      Mac mini NICHT im Provisioning registriert (Tests auf „My Mac Designed for iPad“ scheitern daran).
    rationale: |
      Würde Roberts Apple-Developer-Konto ändern; nur mit seiner Zustimmung.
