summary: |
  Der Kassenzettel-Scan funktioniert jetzt wie ein Dokumentenscanner (Office-Lens-Stil).
  Jedes Foto wird automatisch auf den Bon zugeschnitten und gerade gezogen (Weg B).
  Weg C ist gebaut: Live-Rahmen um den Bon, Auto-Auslösung nach 1 s Ruhe mit Schalter „Auto/Manuell“,
  Tippen aufs Vorschaubild öffnet das Vollbild mit Zoom und der Pille „Ecken anpassen“ (Ecken-Editor mit Lupe).
  Zwei Fehler sind behoben: Antippen des Vorschaubilds löschte oft die Aufnahme; ✕ im Vollbild reagierte nur auf die Striche.
  Der Bon speichert seine Positionen in der DB (Migration 029, live), Preise verweisen auf ihren Bon.
  ☰ → „Gespeicherte Kassenzettel“ öffnet das Archiv direkt.
  Alles ist uncommitted auf main; zuletzt am 28.09. 08:22 auf Roberts iPhone installiert.
  Im Arbeitsbaum liegen auch fremde, ungetestete Änderungen einer anderen Sitzung (ProductDetail*, HybridSheetLayer).
goal: |
  Roberts Wunsch: Kassenzettel automatisch aus dem Foto schneiden wie Office Lens, in gleicher oder besserer Qualität.
  Präzisierungen von Robert: erst Weg B (Zuschnitt nach dem Foto), dann Weg C (live);
  nur zuschneiden, kein Aufhellen; Auto-Auslösung mit Schalter; Entwürfe von Claude, Freigabe durch Robert (erteilt);
  Tippen aufs Vorschaubild = Vollbild mit Zoom + Pille „Ecken anpassen“.
  Nachträglich gewünscht: Bon „dem Einkauf zuordnen“ = Bon speichert seine Artikel (Option „Bon mit seinen Artikeln“)
  und das Archiv ist aus dem Hamburger-Menü erreichbar.
  Fertig, wenn: Robert das Verhalten auf dem iPhone abnimmt, die Anzeige der Positionen im Bon-Detail entschieden ist
  und alles committet ist.
