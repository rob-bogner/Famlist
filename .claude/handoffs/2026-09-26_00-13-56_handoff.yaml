    ListViewModel.applyReceiptPrices: gleichnamige Listenartikel über updateItem (SwiftData +
    SyncEngine) und Artikelstamm über catalogRepository.update (Offline-Warteschlange).
  - |
    ReceiptFlowViewModel.priceChanges: nur zugeordnete/geprüfte Positionen mit abweichendem Preis
    (Liste oder Artikelstamm); Decimal→Double über Text (doubleValue lieferte 2,4899999999999998).
  - |
    ReceiptParser: Mengenzeilen („2 Stk x 1,29“, „2 x 1,29“) setzen quantity der Position mit
    passendem Betrag (davor, sonst danach); Preisverlauf und Artikelpreis speichern den Stückpreis.
    „2 x 1,29“ wurde vorher fälschlich als Artikel „2 x“ erkannt.
  - |
    Fehler behoben: EditItemSheet verlor Eingaben beim Wechsel in den Preisverlauf (Formular wurde
    aus altem ItemModel neu aufgebaut). Jetzt Entwurf in ShoppingListView.editDraft, verworfen bei
    jedem anderen Sheet; `item` bleibt Vergleichsbasis für onPriceChanged.
  - |
    Tests: ReceiptItemPriceTests, erweiterte ReceiptFlowTests/ReceiptParserTests,
    EditPriceDraftUITests (Fixture, schlug vor dem Fix fehl), LiveReceiptPriceUITests (2 Tests:
    Bearbeiten, Bon mit echter Vision-Texterkennung aus Simulator-Fotos, Einkauf abschließen und
    neu hinzufügen, Artikel verwalten; prüft Karte, Neustart und Server items/item_catalog).
  - |
    Commit 28159d3 gepusht (Upstream origin/audit-fixes neu gesetzt); App aufs iPhone installiert.
