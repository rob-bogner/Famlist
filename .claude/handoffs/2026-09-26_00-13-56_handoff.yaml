    rationale: |
      CLAUDE.md: kein neues UI ohne Design; Korrekturen in „Kassenzettel prüfen“ nutzen bereits
      System-Dialoge. Als Abweichung in PLAN §9 eingetragen.
  - decision: |
      Positionen mit Status „Neuer Artikel“ ändern keinen Artikelpreis und legen keinen Artikel an.
    rationale: |
      Es gibt keinen Artikel zum Aktualisieren; ob „Als neuen Artikel speichern“ künftig einen
      Artikelstamm-Eintrag anlegen soll, ist Roberts Entscheidung (offen).
  - decision: |
      Preispunkte (Preisverlauf) speichern jetzt den Stückpreis statt des Zeilenbetrags.
    rationale: |
      Konsistent mit manuellen Preisen (ItemModel.price ist je Stück) und der Kartensumme.
