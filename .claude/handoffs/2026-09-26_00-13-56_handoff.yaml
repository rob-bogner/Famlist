summary: |
  Kassenzettel-Preise werden jetzt als Artikelpreise gespeichert (Rückfrage „Artikelpreise
  aktualisieren?“), und ein beim Bearbeiten eingetippter Preis geht nicht mehr verloren, wenn man
  zwischendurch den Preisverlauf öffnet. Beides ist im Simulator gegen den echten Supabase-Server
  per Live-UI-Test belegt, committet (28159d3) und nach origin/audit-fixes gepusht. Die App ist auf
  Roberts iPhone 16 Pro Max installiert; sein Abnahmetest steht aus.
goal: |
  Robert: Nach der Artikelerkennung im Kassenzettel-Scan soll man die Bon-Preise als neue
  Artikelpreise speichern können. Präzisierung nach Rückmeldung „Preise werden nicht gespeichert“:
  Code gründlich prüfen, im Simulator loopen bis die Preise im Artikel gespeichert sind (auch der
  Fall „Preis beim Bearbeiten nicht gespeichert“ vom Nachmittag), 0 % Fehlertoleranz, danach auf
  das iPhone für den Abnahmetest. Fertig, wenn Robert die Abnahme auf dem Gerät bestätigt.
